<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // GoBalance SDK integration — see ../GOBALANCE_SDK.md for the full contract this depends
      // on. Everything below is a no-op outside the Unity WebView (guarded by
      // `if (window.Unity)` / feature checks), so it's always safe to ship, including when
      // testing in a normal browser.

      // The only channel for JS errors on-device — there's no devtools console inside the
      // WebView, so surface them through the native bridge instead.
      window.addEventListener('error', function (e) {
        if (window.Unity) window.Unity.call('JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (window.Unity) window.Unity.call('JS UNHANDLED REJECTION: ' + e.reason);
      });

      // rAF shim: WKWebView treats the occluded Unity overlay as a background tab and
      // suspends requestAnimationFrame entirely. Queue callbacks instead of scheduling them
      // natively; Unity's WebGameController flushes the queue via window.__pumpFrames() every
      // frame (~60Hz) regardless of tab visibility. A real native rAF loop keeps running
      // underneath too, so a normal browser (testing outside Unity) behaves exactly as before.
      (function () {
        var nativeRAF = window.requestAnimationFrame.bind(window);
        window.__rafQueue = [];
        window.requestAnimationFrame = function (cb) { window.__rafQueue.push(cb); return window.__rafQueue.length; };
        window.cancelAnimationFrame = function () {};
        window.__pumpFrames = function () {
          var q = window.__rafQueue;
          if (!q.length) return;
          window.__rafQueue = [];
          var t = performance.now();
          for (var i = 0; i < q.length; i++) {
            try { q[i](t); }
            catch (e) { if (window.Unity) window.Unity.call('RAF CB ERROR: ' + e.message); }
          }
        };
        (function nativeLoop() { nativeRAF(function () { window.__pumpFrames(); nativeLoop(); }); })();
      })();
    </script>
    <title>Half-Shell Hustle</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="app"></div>

      <!-- GoBalance SDK: native-bridge Back button. Returns to the SDK games list.
           Cross-game HUD convention (see BUILD_NOTES.md): back + pause live top-right
           as icon-only buttons, back is a plain X, score/status live top-left.
           absolute (not fixed) -- positioned relative to #stage, the locked-aspect
           box, so it stays anchored to the visible game frame, not the raw viewport. -->
      <button id="gb-back"
        onclick="if(window.Unity)window.Unity.call('nav:back');"
        style="position:absolute;top:12px;right:12px;z-index:9999;width:38px;height:38px;border:none;
               border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
               font:600 20px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
               line-height:1;display:flex;align-items:center;justify-content:center;
               -webkit-tap-highlight-color:transparent;">&times;</button>

      <!-- Pause button -- placeholder glyph icon (real icon art later); sits left of
           Back per the same convention. -->
      <button id="pause-button"
        style="position:absolute;top:12px;right:60px;z-index:9999;width:38px;height:38px;border:none;
               border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
               font:600 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
               line-height:1;display:flex;align-items:center;justify-content:center;
               -webkit-tap-highlight-color:transparent;">&#9208;</button>

      <!-- Settings (gear, left of Pause): board steering tuning -- mode, lane
           zones, hysteresis, jump tilt, host sensitivity, adjustable live and
           mid-run, because the board is the only place any of it can be
           judged and you can't edit a Unity Inspector field while standing on
           one -- plus SFX/MUSIC on-off. One panel for both rather than a
           second button+panel, since this is the only touch-and-key-
           navigable settings surface the game has (see src/ui/
           steeringPanel.js's header for why). Rows are built there, not
           written here. -->
      <button id="steering-button" title="Settings"
        style="position:absolute;top:12px;right:108px;z-index:9999;width:38px;height:38px;border:none;
               border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
               font:600 17px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
               line-height:1;display:flex;align-items:center;justify-content:center;
               -webkit-tap-highlight-color:transparent;">&#9881;</button>
      <div id="steering-panel" class="hidden"></div>

      <div id="hud">
        <!-- POINTS: the single headline number, upper centre. Direct feedback
             replaced three competing top-left readouts (distance / kill score /
             coin count) with one merged total -- "those values summed up into
             one main points value" -- and moved it where the eye already is,
             since a lane runner is read down the middle of the screen.
             The distance meter is gone entirely, also per that feedback; the
             value is still tracked and still shown on the game-over recap.
             #points-value is the flight target for ui/pointsFly.js's labels,
             so it must stay a distinct element that can be measured. -->
        <div id="points-hud">
          <div id="points-row">
            <!-- #points-value stays the flight target for ui/pointsFly.js
                 (still the element it measures/lands on) but no longer holds
                 the digits directly -- #points-value-text does, since
                 ui/hud.js writes textContent every score change and that
                 would silently delete #points-burst below if it lived on
                 this element instead. Particle burst on the counter,
                 enemy-kill landings only -- direct feedback: bigger squeeze
                 AND particles for a kill, smaller squeeze for a coin. Built
                 once by ui/hud.js, replayed per landing -- see that file's
                 buildPointsBurst. Nested INSIDE #points-value (not a sibling
                 in #points-row) so it's centred on the number itself, not
                 the wider row that also includes the smaller "/ 300" --
                 direct feedback, a first pass anchored to the row read too
                 weak/off-centre. -->
            <div id="points-value">
              <span id="points-value-text">0</span>
              <div id="points-burst"></div>
            </div>
            <div id="points-target">/ 300</div>
          </div>
          <!-- XP-style bar toward the next tier. Tier name sits INSIDE the bar
               rather than on its own line: the numbers above already say how
               far there is to go, so the bar's own space is better spent
               naming the thing being worked toward than repeating a figure.
               #tier-flash is a separate full-bar overlay purely for the
               tier-up sweep, so the celebration can't disturb the fill. -->
          <div id="tier-bar">
            <div id="tier-fill"></div>
            <div id="tier-flash"></div>
            <div id="tier-label">TIER 1</div>
          </div>
        </div>
        <div id="topLeft">
          <!-- Lives. Populated by ui/hud.js's initLivesTray from the live cap
               (data/constants.js's LIVES_START), NOT hardcoded here, so a
               future extra-heart upgrade needs no markup change. -->
          <div id="lives-tray"></div>
        </div>

        <!-- Damage flash. Inside #hud (z-index 10) on purpose: that keeps it
             UNDER .overlay (z-index 20) so it can never tint the game-over
             screen, and under the chrome buttons (9999). Driven by a timer in
             core/main.js rather than a one-frame class toggle -- with the rAF
             queue shim in <head> being pumped from two places, a single frame
             is not guaranteed to reach a composite at all. -->
        <div id="damage-flash"></div>

        <div id="paused-badge" class="hidden">PAUSED</div>

        <!-- TEMPORARY debug readout for calling out specific run-cycle
             frames by number during playtest feedback -- remove once the
             frame set is locked in. -->
        <div id="frame-debug" style="display:none;position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
             z-index:9999;background:rgba(20,20,40,0.72);color:#eafcff;padding:6px 14px;
             border-radius:8px;font:600 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
             white-space:nowrap;"></div>

      </div>

      <!-- Curtain panels -- direct feedback: slide two TMNT-graphic panels in
           from the sides partway through the level-complete countdown, both
           as their own flourish and so the environment swap in core/main.js's
           startNextLevel has a genuinely opaque cover to hide behind (the
           #level-complete radial-gradient background below is NOT fully
           opaque at its center, so that swap was never actually hidden
           before this). A SIBLING of #level-complete, not a child of it, on
           purpose: #level-complete gets display:none the instant
           startNextLevel calls hideLevelComplete, and a transition cannot
           play on an element whose ancestor just went display:none -- the
           curtains would (and did) snap open in a single frame instead of
           sliding. Living outside that element is what lets them keep
           animating after the text/confetti overlay is already gone. See
           ui/hud.js's open/closeLevelCurtains. -->
      <div id="lc-curtain-left" class="lc-curtain"></div>
      <div id="lc-curtain-right" class="lc-curtain"></div>

      <!-- Level-complete transition. NOT the SDK's #gameover-overlay -- that id
           is contractual (the host watches it and synth-clicks #restart-button
           inside it), so this is a separate element with its own id and no
           button, and the host will correctly ignore it. -->
      <div id="level-complete" class="overlay hidden">
        <!-- Confetti pool -- built once by ui/hud.js, replayed on every
             showLevelComplete() call. Direct feedback: the screen read as
             ambiguous ("did I die, or did something good happen?") because it
             was visually just the game-over overlay with different words --
             same dark wash, no motion, no color language of its own. This is
             the fix: an unambiguous celebratory beat, not just a label swap. -->
        <div id="lc-confetti"></div>
        <!-- The emotional headline, and deliberately the FIRST thing read --
             "LEVEL COMPLETE" is now a caption underneath it, not the title. -->
        <div id="lc-headline">AWESOME!</div>
        <div id="lc-title">LEVEL COMPLETE</div>
        <div id="lc-next">NEXT: DOWNTOWN</div>
        <div id="lc-ready">GET READY</div>
        <div id="lc-countdown">5</div>
      </div>

      <div id="gameover-overlay" class="overlay hidden">
        <div class="title">HIT!</div>
        <!-- Final points get the hero treatment; the per-source breakdown the
             merged counter hides during play (kills / coins / distance) is
             spelled out here instead, which is the natural place for it. -->
        <div id="final-points">0</div>
        <div id="final-breakdown"></div>
        <button id="restart-button">RETRY</button>
      </div>

      <!-- First-run onboarding, direct feedback: two auto-cycling explainer
           steps ("really explanatory", an actual moving diagram, not a
           screenshot with an arrow drawn on it) shown before the world
           starts, EVERY run. core/main.js's beginIntro/advanceIntroStep/
           dismissIntro drive it; data/introTutorial.js holds the cycle
           data. NOT #gameover-overlay (see that overlay's own comment) --
           own id, own #intro-next-button/#intro-start-button, so the SDK's
           synthetic #restart-button click can never target this. -->
      <div id="intro-tutorial-overlay" class="overlay hidden">
        <div id="intro-step-lanes" class="intro-step">
          <div class="intro-step-title">TILT TO MOVE LEFT / RIGHT / MIDDLE</div>
          <img id="intro-player" class="intro-sprite" alt="" />
          <div id="intro-board-lanes" class="intro-board"></div>
          <button id="intro-next-button">NEXT</button>
        </div>
        <div id="intro-step-jump" class="intro-step hidden">
          <div class="intro-step-title">FORWARD/BACKWARDS TO JUMP</div>
          <img id="intro-jumper" class="intro-sprite" alt="" />
          <div id="intro-board-jump" class="intro-board"></div>
          <button id="intro-start-button">START</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/core/main.js"></script>
  </body>
</html>
