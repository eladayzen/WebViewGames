<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sewer Shred</title>
  <script>
    // GoBalance SDK integration — see GOBALANCE_SDK.md for the full contract this depends
    // on. Everything below is a no-op outside the Unity WebView (guarded by
    // `if (window.Unity)` / feature checks), so it's always safe to ship, including when
    // testing in a normal browser.

    // The only channel for JS errors on-device — there's no devtools console inside the
    // WebView, so surface them through the native bridge instead.
    window.addEventListener('error', function (e) {
      if (window.Unity) window.Unity.call('JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (window.Unity) window.Unity.call('JS UNHANDLED REJECTION: ' + e.reason);
    });

    // rAF shim: WKWebView treats the occluded Unity overlay as a background tab and
    // suspends requestAnimationFrame entirely. Queue callbacks instead of scheduling them
    // natively; Unity's WebGameController flushes the queue via window.__pumpFrames() every
    // frame (~60Hz) regardless of tab visibility. A real native rAF loop keeps running
    // underneath too, so a normal browser (testing outside Unity) behaves exactly as before.
    (function () {
      var nativeRAF = window.requestAnimationFrame.bind(window);
      window.__rafQueue = [];
      window.requestAnimationFrame = function (cb) { window.__rafQueue.push(cb); return window.__rafQueue.length; };
      window.cancelAnimationFrame = function () {};
      window.__pumpFrames = function () {
        var q = window.__rafQueue;
        if (!q.length) return;
        window.__rafQueue = [];
        var t = performance.now();
        for (var i = 0; i < q.length; i++) {
          try { q[i](t); }
          catch (e) { if (window.Unity) window.Unity.call('RAF CB ERROR: ' + e.message); }
        }
      };
      (function nativeLoop() { nativeRAF(function () { window.__pumpFrames(); nativeLoop(); }); })();
    })();
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- GoBalance SDK: native-bridge Back button. Returns to the SDK games list. -->
  <button id="gb-back"
    onclick="if(window.Unity)window.Unity.call('nav:back');"
    style="position:fixed;top:12px;left:12px;z-index:9999;padding:8px 16px;border:none;
           border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
           font:600 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
           -webkit-tap-highlight-color:transparent;">&#8249; Back</button>

  <div id="corner-btns">
    <button id="pause-btn" class="round-btn" aria-label="Pause">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
    <button id="mode-btn" class="pill-btn" aria-label="Movement mode">SWING</button>
    <button id="mute-btn" class="round-btn" aria-label="Mute">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <canvas id="game"></canvas>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="speedlines"></div>

  <div id="hud">
    <div id="score-wrap"><div id="score">0</div><div id="dist">0 m</div></div>
    <div id="lives"></div>
    <div id="combo-wrap"><div id="combo">x1</div><div id="combo-bar"><i></i></div></div>
    <div id="slime-tag">SPLASH!</div>
  </div>
  <div id="popups"></div>
  <div id="countdown"></div>

  <div id="loading">
    <div class="logo">SEWER<br/><b>SHRED</b></div>
    <div class="spinner"></div>
  </div>

  <div id="pause-overlay" class="hidden">
    <div class="panel">
      <div class="go-title paused">PAUSED</div>
      <button id="resume-button">RESUME</button>
      <div class="go-hint">tap, hold a lean, or press Space</div>
    </div>
  </div>

  <div id="gameover-overlay" class="hidden">
    <div class="panel">
      <div class="go-title">WIPEOUT!</div>
      <div class="go-score"><span>SCORE</span><b id="go-score">0</b></div>
      <div class="go-row"><span>Distance</span><b id="go-dist">0 m</b></div>
      <div class="go-row"><span>Pizza</span><b id="go-pizza">0</b></div>
      <div class="go-row"><span>Best combo</span><b id="go-combo">x1</b></div>
      <div class="go-best" id="go-best"></div>
      <button id="restart-button">SHRED AGAIN</button>
      <div class="go-hint">lean or press Space</div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
