<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sewer Shred</title>
  <!-- No favicon in the WebView; an empty data: icon stops the browser asking for /favicon.ico (404). -->
  <link rel="icon" href="data:," />
  <link rel="preload" href="/fonts/bangers-latin.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    // GoBalance SDK integration — see GOBALANCE_SDK.md for the full contract this depends
    // on. Everything below is a no-op outside the Unity WebView (guarded by
    // `if (window.Unity)` / feature checks), so it's always safe to ship, including when
    // testing in a normal browser.

    // The only channel for JS errors on-device — there's no devtools console inside the
    // WebView, so surface them through the native bridge instead.
    window.addEventListener('error', function (e) {
      if (window.Unity) window.Unity.call('JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (window.Unity) window.Unity.call('JS UNHANDLED REJECTION: ' + e.reason);
    });

    // rAF shim: WKWebView treats the occluded Unity overlay as a background tab and
    // suspends requestAnimationFrame entirely. Queue callbacks instead of scheduling them
    // natively; Unity's WebGameController flushes the queue via window.__pumpFrames() every
    // frame (~60Hz) regardless of tab visibility. A real native rAF loop keeps running
    // underneath too, so a normal browser (testing outside Unity) behaves exactly as before.
    (function () {
      var nativeRAF = window.requestAnimationFrame.bind(window);
      window.__rafQueue = [];
      window.requestAnimationFrame = function (cb) { window.__rafQueue.push(cb); return window.__rafQueue.length; };
      window.cancelAnimationFrame = function () {};
      window.__pumpFrames = function () {
        var q = window.__rafQueue;
        if (!q.length) return;
        window.__rafQueue = [];
        var t = performance.now();
        for (var i = 0; i < q.length; i++) {
          try { q[i](t); }
          catch (e) { if (window.Unity) window.Unity.call('RAF CB ERROR: ' + e.message); }
        }
      };
      (function nativeLoop() { nativeRAF(function () { window.__pumpFrames(); nativeLoop(); }); })();
    })();
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <div id="corner-btns">
    <button id="pause-btn" class="round-btn" aria-label="Pause">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
    <!-- GoBalance SDK back, as an X right of pause (Elad 2026-11-22). Same id + onclick: __gbBack asks first mid-run. -->
    <button id="gb-back" class="round-btn" aria-label="Exit"
      onclick="(window.__gbBack || function(){ if(window.Unity) window.Unity.call('nav:back'); })()">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
    <button id="dev-btn" class="round-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 2l-1.9-.4a6.9 6.9 0 0 0-.7-1.6l1.1-1.6-1.6-1.6-1.6 1.1a6.9 6.9 0 0 0-1.6-.7l-.4-1.9h-2.3l-.4 1.9a6.9 6.9 0 0 0-1.6.7L7.8 5.3 6.2 6.9l1.1 1.6a6.9 6.9 0 0 0-.7 1.6l-1.9.4v2.3l1.9.4c.2.6.4 1.1.7 1.6l-1.1 1.6 1.6 1.6 1.6-1.1c.5.3 1 .5 1.6.7l.4 1.9h2.3l.4-1.9c.6-.2 1.1-.4 1.6-.7l1.6 1.1 1.6-1.6-1.1-1.6c.3-.5.5-1 .7-1.6l1.9-.4z"/></svg></button>
    <button id="mode-btn" class="pill-btn dev more" aria-label="Direct or swing">DIRECT</button>
    <button id="var-btn" class="pill-btn dev more" aria-label="Direct variant">220</button>
    <button id="cam-btn" class="pill-btn dev more" aria-label="Fixed camera position" style="display:none">CAM LOW</button>
    <button id="top-btn" class="pill-btn dev more" aria-label="Open-top pipe (dev)">TOP CLOSED</button>
    <button id="world-btn" class="pill-btn dev more" aria-label="Start world (dev)">SEWERS</button>
    <button id="foe-btn" class="pill-btn dev more" aria-label="Foot Soldier look (dev)">FOE PNG SPRITE</button>
    <button id="mute-btn" class="round-btn" aria-label="Mute">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <!-- dev column (Elad 2026-11-23): jump to any level, fire any ability now -->
  <div id="dev-col" class="dev-col">
    <!-- the front of the dev panel (Elad 2026-11-24): calibrate + steering; the rest under MORE -->
    <button id="dev-cal" class="pill-btn dev">CALIBRATE</button>
    <button id="dev-steer" class="pill-btn dev">STEER: MEDIUM</button>
    <button id="dev-more" class="pill-btn dev">MORE &#9656;</button>
    <div class="dev-row"><button id="dev-lv-prev" class="pill-btn dev more" aria-label="Previous level">&#9664;</button><button id="dev-lv" class="pill-btn dev more" aria-label="Next level">LEVEL &#9654;</button></div>
    <button id="dev-glider" class="pill-btn dev more">GLIDER</button>
    <button id="dev-saws" class="pill-btn dev more">SAW ARMS</button>
    <button id="dev-shield" class="pill-btn dev more">SHIELD</button>
    <button id="dev-sai" class="pill-btn dev more">STARS</button>
    <button id="dev-gear" class="pill-btn dev more">BACKPACK</button>
    <button id="dev-floor" class="pill-btn dev more">FLOOR: LEVEL</button>
  </div>

  <canvas id="game"></canvas>
  <!-- through the portal (Elad 2026-11-23): the street is gone, you're in the warp -->
  <div id="warp" class="hidden"><i></i></div>
  <!-- Board max-angle calibration wizard — copied from RoboRun (src/ui/calibrationWizard.js +
       src/systems/boardCalibration.js, its own "template file" for GoBalance games). -->
  <div id="calibration-overlay" class="hidden">
    <div id="calibration-title" class="intro-step-title">STAND ON THE BOARD</div>
    <div id="calibration-sub" class="calibration-sub">Get comfortable.</div>
    <div id="calibration-value" class="hidden"></div>
    <div id="calibration-board-wrap">
      <div id="calibration-board" class="intro-board">
        <div class="cal-foot cal-foot-left"></div>
        <div class="cal-foot cal-foot-right"></div>
      </div>
    </div>
    <div id="calibration-progress"><div id="calibration-progress-fill"></div></div>
    <button id="calibration-cancel">CANCEL</button>
  </div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="speedlines"></div>

  <div id="hud">
    <div id="score-wrap"><div id="score">0</div><div id="dist">0 m</div></div>
    <div id="goal" class="hidden"></div>
    <div id="lives"></div>
    <div id="combo-wrap"><div id="combo">x1</div><div id="combo-bar"><i></i></div></div>
    <div id="slime-tag">SPLASH!</div>
    <div id="power"><img src="/tex/sai_icon.png" alt="" /><div class="bar"><i id="power-bar"></i></div></div>
  </div>
  <div id="popups"></div>
  <div id="countdown"></div>
  <div id="turn"><span class="l" id="turn-l">&#9664; LEFT</span><span class="r" id="turn-r">RIGHT &#9654;</span></div>

  <div id="loading">
    <div class="logo">SEWER<br/><b>SHRED</b></div>
    <div class="spinner"></div>
  </div>

  <div id="pause-overlay" class="hidden">
    <div class="panel">
      <div class="go-title paused">PAUSED</div>
      <button id="resume-button">RESUME</button>
      <div class="go-hint">tap, hold a lean, or press Space</div>
    </div>
  </div>

  <!-- level card (Elad 2026-11-22: one step, minimum words): level, title, goal icon + number,
       the NEW power (it's this level's first pickup), a round GO whose ring is the auto-start clock -->
  <!-- the LOBBY: level map (unlocked left to right), Donnie's line, the goal, GO -->
  <div id="lobby" class="hidden">
    <!-- Donnie, full body (Wagon Rampage's cut-out), talking from the left -->
    <img id="lb-donnie" src="/tex/donnie_full.png" alt="">
    <div class="lb-logo">SEWER <b>SHRED</b></div>
    <div id="lb-map"></div>
    <div class="lb-card">
      <div id="lb-num"></div>
      <div id="lb-title"></div>
      <div id="lb-say" class="hidden"><img src="/tex/donnie_head.png" alt=""><p></p></div>
      <div class="lb-row"><div id="lb-goal"></div><div id="lb-new" class="hidden"></div></div>
      <div class="lb-go-wrap"><button id="lb-go" class="ring-btn" aria-label="Go"><svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" pathLength="100" class="track"/><circle cx="22" cy="22" r="20" pathLength="100" class="run" id="lb-ring"/></svg><span>GO</span></button>
      <div class="lb-hint"><svg viewBox="0 0 24 24"><path d="M12 3l7 8h-4.5v9h-5v-9H5z" fill="#ffe25a" stroke="#14181a" stroke-width="1.4" stroke-linejoin="round"/></svg>LEAN FORWARD</div></div>
    </div>
  </div>
  <div id="level-card" class="hidden">
    <div class="lc-card">
      <div id="lc-num"></div>
      <div id="lc-title"></div>
      <div id="lc-say" class="hidden"><img src="/tex/donnie_head.png" alt=""><p></p></div>
      <div id="lc-goal"></div>
      <div id="lc-new" class="hidden"></div>
      <button id="lc-go" class="ring-btn" aria-label="Go"><svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" pathLength="100" class="track"/><circle cx="22" cy="22" r="20" pathLength="100" class="run" id="lc-ring"/></svg><span>GO</span></button>
    </div>
  </div>
  <!-- level clear: its own id — never #gameover-overlay (the host clicks #restart-button on Space there) -->
  <div id="level-clear" class="hidden">
    <div class="lc-card">
      <div id="lclr-title">LEVEL CLEAR!</div>
      <button id="lclr-next" class="ring-btn" aria-label="Next"><svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" pathLength="100" class="track"/><circle cx="22" cy="22" r="20" pathLength="100" class="run" id="lclr-ring"/></svg><svg class="arrow" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    </div>
  </div>

  <div id="gameover-overlay" class="hidden">
    <div class="panel">
      <div class="go-title">WIPEOUT!</div>
      <div class="go-score"><span>SCORE</span><b id="go-score">0</b></div>
      <div class="go-row"><span>Distance</span><b id="go-dist">0 m</b></div>
      <div class="go-row"><span>Pizza</span><b id="go-pizza">0</b></div>
      <div class="go-row"><span>Best combo</span><b id="go-combo">x1</b></div>
      <div class="go-best" id="go-best"></div>
      <ol class="board" id="go-board"></ol>
      <button id="restart-button">SHRED AGAIN</button>
      <div class="go-hint">lean or press Space</div>
    </div>
  </div>

  <!-- X mid-run: a modal over the paused game (the run stays visible), icons only -->
  <div id="quit-confirm" class="hidden">
    <div class="qc-card">
      <div class="qc-q">QUIT?</div>
      <div class="qc-row">
        <button id="qc-no" class="qc-btn no" aria-label="Keep playing"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="qc-yes" class="qc-btn yes" aria-label="Quit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="3.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>

  <!-- after a confirmed quit: the run's score (banked), the board, play again / quit. Its own id,
       never #gameover-overlay (the host clicks #restart-button on Space there). No clock. -->
  <div id="quit-overlay" class="hidden">
    <div class="panel">
      <div class="go-score"><span>SCORE</span><b id="q-score">0</b></div>
      <ol class="board" id="q-board"></ol>
      <div class="q-row">
        <button id="q-again" class="q-btn again" aria-label="Play again"><svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke-width="3" stroke-linecap="round"/><path d="M4 4v6h6z"/></svg></button>
        <button id="q-leave" class="q-btn leave" aria-label="Quit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="3.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
