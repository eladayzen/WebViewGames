<!doctype html>
<html><head><meta charset="utf-8"><title>L2 SDF Ink</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
cv.width = innerWidth; cv.height = innerHeight;
const gl = cv.getContext('webgl', { antialias: false });
{ const e = gl.getExtension('WEBGL_debug_renderer_info'); window.__gpu = e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : 'n/a'; }
gl.getExtension('OES_standard_derivatives');

const VS = `attribute vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;
const FS = `
#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec2 uRes; uniform float uT, uScroll, uH;   // uH = rider height on face 0..1
#define INK vec3(0.07,0.04,0.12)
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+1.),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p*=2.03;a*=.5;}return s;}
float boil;   // 8fps line boil
// ink line from a signed distance: width in px with jitter
float ink(float d, float wpx, vec2 p){
  float j = vn(p*55. + boil*3.7);
  float w = wpx*mix(0.55,1.45,j);
  float aa = fwidth(d);
  return 1.-smoothstep(w*0.5-0.5, w*0.5+0.5, abs(d)/aa);
}
float sdCapsule(vec2 p, vec2 a, vec2 b, float r){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdBox(vec2 p, vec2 b){vec2 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,d.y),0.);}

// ------------- wave geometry (units: screen heights) -------------
const vec2 C0 = vec2(0.14, 0.45);     // barrel centre
const float HZ = 0.60;                // horizon (hidden behind the wave; skyline pokes above the crest)
float R()     { return 0.20 + 0.010*sin(uT*1.4); }
float trough(){ return 0.05; }
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float thetaEnd(){ return 4.0 + 0.15*sin(uT*1.5); }
const float TH0 = 1.15;
float lipW(float a){ float k = clamp((a-TH0)/(thetaEnd()-TH0),0.,1.); return mix(0.10, 0.016, pow(k,0.7)) * (1.0 + 0.10*sin(uT*1.5 - k*2.5)); }
float crestOf(float x){
  float u = x + uScroll;
  float c = 0.71 - 0.05*smoothstep(C0.x, C0.x+1.3, x);       // near-flat crest line (reference)
  c += 0.015*sin(u*3.1 - uT*1.0) + 0.006*sin(u*7.3 + uT*1.4) + 0.025*(fbm(vec2(u*2.0, uT*0.25))-0.5);
  float top = C0.y + R() + 0.06;
  return mix(c, top, smoothstep(C0.x+0.40, C0.x+0.05, x));
}
float rinAt(float a){            // tapered spiral: inner radius shrinks toward the tip, wobbles
  float k = clamp((a-TH0)/(thetaEnd()-TH0),0.,1.);
  return R()*(1.0 - 0.34*k*k) * (1.0 + 0.05*(vn(vec2(a*2.3, uT*0.6))-0.5));
}
float sdLip(vec2 p, out float ang, out float across){
  vec2 q=p-C0; float r=length(q);
  float a=atan(q.y,q.x); if(a<-1.57) a+=6.2831853;
  ang=a;
  float te=thetaEnd();
  float ac=clamp(a,TH0,te);
  float Rin = rinAt(ac);
  float w = lipW(ac);
  across=(r-Rin)/w;
  float dr = abs(r - (Rin + w*0.5)) - w*0.5;
  vec2 tipP = vec2(cos(te),sin(te))*(rinAt(te) + lipW(te)*0.5);
  float tip = length(q - tipP) - lipW(te)*0.5;
  return (a>te) ? tip : (a<0.35 ? max(dr, (0.35-a)*r) : dr);   // root buried inside the face body: no seam
}
float sdHole(vec2 p){             // irregular tube following the spiral, egg-shaped toward the face wall
  vec2 q=p-C0; float r=length(q);
  float a=atan(q.y,q.x); if(a<-1.57) a+=6.2831853;
  float te=thetaEnd();
  float Rh = a<TH0 ? mix(R()*0.70, R()*0.97, smoothstep(-1.57, TH0, a))
           : a>te  ? mix(rinAt(te)*0.95, R()*0.70, smoothstep(te, 4.71, a))
           : rinAt(a)*0.97;
  return (r - Rh)*0.9;
}

float pileF(vec2 p){
  float tr = trough();
  float churn = fbm(vec2(p.x*6. + uT*1.2, p.y*6. - uT*2.0));
  float pile = 1e3;
  for(int i=0;i<6;i++){
    float fi=float(i);
    vec2 c = vec2(C0.x + 0.06 - fi*0.13 + 0.025*sin(uT*2.2+fi), tr + 0.07 + 0.05*h21(vec2(fi,1.)) + 0.025*sin(uT*2.6+fi*2.));
    float r = 0.12 - fi*0.008 + 0.02*sin(uT*2.3+fi*1.7);
    pile = smin(pile, length(p-c)-r, 0.04);
  }
  pile = smin(pile, max(p.y - tr - 0.035, p.x - C0.x + 0.05), 0.05);
  pile += 0.045*(churn-0.5);
  pile = smin(pile, length(p - (C0 + vec2(cos(thetaEnd()),sin(thetaEnd()))*R()*0.9 - vec2(0.,0.06))) - 0.07 - 0.03*churn, 0.05);
  return pile;
}
void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 p = frag / uRes.y;
  boil = floor(uT*8.);
  float u = p.x + uScroll;
  float tr = trough();

  // ---------------- sky + city ----------------
  vec3 col = mix(vec3(0.93,0.35,0.52), vec3(0.25,0.11,0.40), smoothstep(0.5,1.0,p.y));
  col = mix(col, vec3(1.0,0.78,0.35), smoothstep(0.62,0.42,p.y)*0.6);
  float bx = floor((p.x + uScroll*0.08)*22.);
  float bh = HZ + 0.10 + 0.13*h21(vec2(bx,3.)) + 0.08*step(0.8,h21(vec2(bx,7.)));
  if(p.y < bh){
    col = vec3(0.22,0.10,0.34);
    vec2 wc = vec2((p.x+uScroll*0.08)*22.*5., p.y*70.);
    vec2 cell = floor(wc), f = fract(wc);
    if(h21(cell)>0.78 && f.x>0.3&&f.x<0.7&&f.y>0.3&&f.y<0.7) col = h21(cell+3.)>0.5? vec3(1.,0.83,0.):vec3(0.,0.79,1.);
  }
  if(p.y < HZ){ col = mix(vec3(0.06,0.30,0.42), vec3(0.12,0.48,0.58), step(0.6, vn(vec2(u*5., p.y*70.)))); }
  float L = ink(p.y-HZ, 2.0, p);

  // ---------------- wave mass ----------------
  float crest = crestOf(p.x);
  float dFace = max(p.y - crest, C0.x + 0.02 - p.x - max(0., C0.y - R()*0.5 - p.y)*4.);
  float ang, across; float dLip = sdLip(p, ang, across);
  float dHole = sdHole(p);
  float dMass = smin(dFace, dLip, 0.03);
  dMass = max(dMass, -dHole);                                 // carve tube
  float hf = clamp((p.y - tr)/(crest - tr), 0., 1.);
  vec3 c0=vec3(0.02,0.30,0.42), c1=vec3(0.0,0.55,0.68), c2=vec3(0.15,0.78,0.85), c3=vec3(0.55,0.95,0.93);
  if(dMass < 0.){
    // calm domain-warped bands (slow drift, no vertical bob, no ink on inner patches)
    vec2 q = vec2(u*2.0, hf*2.5);
    q += 0.35*vec2(fbm(q + vec2(uT*0.25, 0.)), fbm(q + vec2(0., -uT*0.2)));
    float hb = hf + 0.08*(fbm(q*1.3 + vec2(-uT*0.15, 0.)) - 0.5);
    vec3 fc = hb<0.30?c0: hb<0.60?c1: hb<0.84?c2:c3;
    float s = vn(vec2(u*7.0 - hf*2.5, hf*26.));
    fc = mix(fc, c3, step(0.80,s)*step(0.15,hf)*0.75);
    fc = mix(fc, c0*0.8, step(0.86,1.-s)*step(hf,0.55)*0.6);
    // hard shadow under the lip on the face
    float under = step(dHole, 0.025) * step(C0.x, p.x) * step(C0.y - 0.08, p.y);
    fc = mix(fc, vec3(0.08,0.20,0.40), under*0.7);
    col = fc;
  }
  // tube interior
  if(dHole < 0. && dLip > 0.){
    float rb = length(p-C0-vec2(-0.035,0.03))/R();
    vec3 tube = rb<0.55? vec3(0.13,0.08,0.30): rb<0.85? vec3(0.07,0.22,0.40): vec3(0.0,0.42,0.56);
    vec2 q=p-C0; float aa=atan(q.y,q.x);
    float sp = step(0.70, vn(vec2(aa*3.0 + rb*5. - uT*5., rb*9.)));
    tube = mix(tube, c2, sp*0.55*step(0.4,rb));
    col = tube;
  }
  if(dLip < 0. && ang > TH0 - 0.1){
    float k = clamp(ang/thetaEnd(),0.,1.);
    vec3 lc = mix(c3, c2, k);
    lc = (across<0.4 && ang>1.0) ? mix(lc, vec3(0.13,0.10,0.33), 0.45): lc;   // shadow inner side
    float fz = fbm(vec2(ang*5. - uT*2.0, across*2.5));
    lc = mix(lc, vec3(0.97,0.98,0.95), step(0.62, fz + across*0.22));
    col = lc;
  }
  L *= step(0., dMass) * step(0., dHole);
  L = max(L, ink(dMass, 3.6, p));
  L = max(L, ink(dLip, 2.4, p) * step(TH0+0.25, ang) * step(0., dHole+0.004));
  float underPos = L; // keep

  // ---------------- whitewater pile where the lip lands ----------------
  float pile = pileF(p);
  if(pile < 0.){
    float lit = pileF(p + vec2(-0.05,0.07));            // shifted toward light: outside => lit rim
    float lit2 = pileF(p + vec2(-0.02,0.03));
    float fb = fbm(vec2(p.x*14. + uT*1.5, p.y*14. - uT*2.2));
    col = (lit2 > 0. || fb>0.62) ? vec3(0.99,0.99,0.96) : (lit > 0. || fb>0.5) ? vec3(0.74,0.88,0.97) : vec3(0.47,0.50,0.82);
    // bubble rings
    vec2 bp = p*vec2(30.,30.) + vec2(uT*2.,-uT*3.);
    vec2 bc = floor(bp), bf = fract(bp);
    float br = length(bf - vec2(h21(bc),h21(bc+7.))*0.6-0.2) - 0.18*h21(bc+3.);
    if(h21(bc+11.)>0.6) L = max(L, ink(br, 2.0, p)*step(pile,-0.01));
  }
  L = max(L*step(0.,pile), ink(pile, 3.2, p));

// ---------------- foreground water ----------------
  if(p.y < tr && pile > 0.){
    float f = fbm(vec2(u*2.5, p.y*22. - uT*0.4));
    col = mix(vec3(0.02,0.24,0.36), vec3(0.0,0.50,0.62), step(0.58,f));
    col = mix(col, vec3(0.85,0.95,0.97), step(0.72,f));
  }
  

  // ---------------- spray dots off the lip/crest ----------------
  vec2 sp = p*vec2(1.,1.) + vec2(-uT*0.12, -uT*0.05);
  vec2 cell = floor(sp*38.); vec2 f = fract(sp*38.);
  float rnd = h21(cell);
  vec2 jo = vec2(h21(cell+1.),h21(cell+2.))*0.6+0.2;
  float dot_ = length(f-jo) - (0.12+0.18*h21(cell+4.));
  float sprayZone = smoothstep(0.05,0.0,abs(p.y - crest - 0.03 - 0.02*rnd)) * step(C0.x+0.1, p.x) * smoothstep(C0.x+0.9, C0.x+0.25, p.x);
  float tipZone = smoothstep(0.10,0.0,length(p - (C0 + vec2(cos(thetaEnd()),sin(thetaEnd()))*R()*0.9)));
  if(dot_ < 0. && rnd > 0.55 && (sprayZone+tipZone)>0.3) col = vec3(0.97,0.98,0.95);

  // ---------------- rider (placeholder capsule on face) ----------------
  float rx = C0.x + 0.55;
  float rcrest = crestOf(rx);
  float ry = tr + 0.03 + uH*(rcrest - tr - 0.10);
  float slope = (crestOf(rx+0.01) - rcrest)/0.01;
  vec2 rp = p - vec2(rx, ry);
  float ca = cos(-0.25 + slope*0.3), sa = sin(-0.25 + slope*0.3);
  vec2 rq = mat2(ca,-sa,sa,ca)*rp;
  float body = sdCapsule(rq, vec2(0.,0.035), vec2(0.,0.095), 0.022);
  float board = sdBox(rq - vec2(0.,0.006), vec2(0.07,0.007)) - 0.003;
  float head = length(rq - vec2(0.,0.125)) - 0.022;
  float rider = 1e3;
  if(rider < 0.){
    col = board<0. ? vec3(1.,0.83,0.) : vec3(0.18,0.62,0.23);
    if(head<0. && abs(rq.y-0.128)<0.007) col = vec3(0.91,0.0,0.65);
    if(rq.x>0.006 && rider<0.) col *= 0.75;    // hard shadow side
  }
  float riderInk = 0.;

  // ---------------- composite ink + paper ----------------
  L = max(L*step(0.,rider), riderInk);
  col = mix(col, INK, clamp(L,0.,1.));
  // hatch in dark tones
  float lum = dot(col, vec3(0.3,0.59,0.11));
  float hatch = step(0.75, fract((frag.x+frag.y)/6.));
  col = mix(col, INK, hatch*step(lum,0.22)*0.5*step(0.4, vn(frag/16.+boil))*step(p.y,0.75));
  // paper grain
  col *= 0.94 + 0.08*h21(frag + boil) + 0.04*vn(frag/3.);
  gl_FragColor = vec4(col,1.);
}`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.log(gl.getShaderInfoLog(o)); return o; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) console.log(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
// JS mirror of the shader's crestOf() so the host knows where the face is
const fr = x => x - Math.floor(x);
function h21(x, y) { x = fr(x * 123.34); y = fr(y * 456.21); const d = x * (x + 45.32) + y * (y + 45.32); x += d; y += d; return fr(x * y); }
function vn(x, y) { const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = h21(ix, iy), b = h21(ix + 1, iy), c = h21(ix, iy + 1), d = h21(ix + 1, iy + 1); return (a + (b - a) * fx) + ((c + (d - c) * fx) - (a + (b - a) * fx)) * fy; }
function fbm(x, y) { let a = .5, s = 0; for (let i = 0; i < 4; i++) { s += a * vn(x, y); x *= 2.03; y *= 2.03; a *= .5; } return s; }
const sst = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function crestJS(x, uT, uScroll) { const C0x = 0.14, C0y = 0.45, Rr = 0.20 + 0.010 * Math.sin(uT * 1.4); const u = x + uScroll;
  let c = 0.71 - 0.05 * sst(C0x, C0x + 1.3, x); c += 0.015 * Math.sin(u * 3.1 - uT * 1.0) + 0.006 * Math.sin(u * 7.3 + uT * 1.4) + 0.025 * (fbm(u * 2.0, uT * 0.25) - 0.5);
  return c + (C0y + Rr + 0.06 - c) * sst(C0x + 0.40, C0x + 0.05, x); }
const U = n => gl.getUniformLocation(pr, n);
const uRes = U('uRes'), uT = U('uT'), uScroll = U('uScroll'), uH = U('uH');
let tAcc = 0; let h = 0.5, up = false, dn = false, last = -1e9, t0 = performance.now(), prev = t0; const px = new Uint8Array(4);
addEventListener('keydown', e => { if (e.key === 'ArrowUp') up = true; if (e.key === 'ArrowDown') dn = true; last = performance.now(); });
addEventListener('keyup', e => { if (e.key === 'ArrowUp') up = false; if (e.key === 'ArrowDown') dn = false; });
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (window.__paused) { requestAnimationFrame(frame); return; }
  tAcc += dt; const t = tAcc;
  if (up || dn || now - last < 2000) h = Math.min(1, Math.max(0, h + ((up ? 1 : 0) - (dn ? 1 : 0)) * dt * 1.2));
  else h = 0.5 + 0.5 * Math.sin(t * 0.9);
  if (window.__H !== undefined) h = window.__H;
  { const Hh = cv.height, asp = cv.width / Hh, rx = 0.24 * asp, tr = 0.05;
    const cr = crestJS(rx, t, t * 0.45); const ry = tr + 0.03 + h * (cr - tr - 0.10);
    window.__riderScreen = { x: rx * Hh, y: Hh - ry * Hh }; }
  const w0 = performance.now();
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(uRes, cv.width, cv.height); gl.uniform1f(uT, t); gl.uniform1f(uScroll, t * 0.45); gl.uniform1f(uH, h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  window.__work && window.__work(performance.now() - w0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
