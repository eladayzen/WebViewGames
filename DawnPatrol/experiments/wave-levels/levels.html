<!doctype html>
<html><head><meta charset="utf-8"><title>Wave Levels</title>
<style>

    background:#ffd400;color:#120a1e;box-shadow:3px 3px 0 #120a1e;cursor:pointer}
  #bar button.on{background:#00ff1e}

<script>
// ===================== tuning (rail units: 0 = trough, 1 = crest; 1 rail = trough-to-crest distance) =====================
const PHYS = {
  GRAVITY: 5.88,       // rail/s^2 pulling down the face, always on            (x1.4^2 of the first tuning)
  THRUST: 8.23,        // rail/s^2 upward push while the single input is held (net up = THRUST - GRAVITY)
  DAMP: 4.2,           // 1/s damping -> terminal up 0.56 rail/s (~1.9 s trough->crest), down 1.4 rail/s (~0.8 s)
  LAUNCH_MIN_V: 0.15,  // rail/s upward speed needed at the lip to launch
  AIR_PEAK_Y: 0.165,   // aerial peak: board height as a fraction of screen height from the top (full-speed launch)
  AIR_TIME: 1.35,      // s in the air for a full-speed launch (gravity derived from peak + time)
  AIR_TOP_MARGIN: 8,   // px: sprite top never goes above this (soft clamp)
  LAND_KEEP: 0.35,     // fraction of downward speed kept on landing
  BOUNCE: 0.25,        // trough bounce (fraction of impact speed), below 0.3 rail/s it just settles
  TILT_PER_V: 0.55,    // board tilt (rad) per rail/s of vertical speed
  TILT_NOSE_UP: 0.38,  // max nose-up tilt (rad)
  TILT_NOSE_DOWN: 0.14,// max nose-down tilt (rad) - kept small so fast drops do not tip him over
  AIR_VX: 420,         // px/s (at 1080p) of 'forward speed' used to turn the jump's vertical speed into a board angle
  AIR_LAND_TILT: 0.40, // rad nose-down the board reaches at touchdown (user: 'end of the jump stronger, like +0.40')
  AIR_TILT_MAX: 0.42,  // rad, max nose up / down in the air (symmetric so the arc reads as a parabola)
  RAMP: 0,             // extra thrust gained while holding: thrust x (1 + RAMP * min(1, holdTime / RAMP_T))
  RAMP_T: 1.6,         // s of holding to reach the full ramp
};
// ---- saved physics presets (dev panel) ----
const PHYS_PRESETS = {
  'A · Current': { GRAVITY: 5.88, THRUST: 8.23, DAMP: 4.2, RAMP: 0, RAMP_T: 1.6, AIR_PEAK_Y: 0.165, AIR_TIME: 1.35 },
  // drop 20% slower (terminal fall 1.12 vs 1.40 rail/s, release->trough 1.13 s vs 0.95 s);
  // climb takes the same 2.03 s trough->lip but starts gentler and accelerates the longer you hold
  'B · Soft drop + ramp': { GRAVITY: 4.704, THRUST: 5.512, DAMP: 4.2, RAMP: 0.5, RAMP_T: 1.6, AIR_PEAK_Y: 0.165, AIR_TIME: 1.35 },
  // the user's saved Custom (B physics). Their AIR_PEAK_Y 0.40 sat below the lip (crest at the rider = 0.327), so every jump
  // fell back to the 60 px minimum hop -> board peak ~0.27. That observed peak is what is locked here, now exact on every jump.
  'C · Saved, locked jump': { GRAVITY: 4.704, THRUST: 5.512, DAMP: 4.2, RAMP: 0.5, RAMP_T: 1.6, AIR_PEAK_Y: 0.27, AIR_TIME: 1.35 },
};
const DEFAULT_PRESET = 'C · Saved, locked jump';
const DIRECT_RATE = 1.68;   // Direct mode: face-heights per second (x1.4)
const WAKE = { RATE: 160, LIFE: 0.55, FLOW: 0.75, SPREAD: 55, GROW: 2.4 };   // per s, s, screen-widths/s, px/s, radius growth

// ===================== obstacles + boss tuning =====================
const GAME = {
  OBST_SIZE: 0.70,          // obstacle height as a fraction of Mikey's height (205 px at 1080p)
  OBST_GAP: [2.6, 4.6],     // s between obstacle spawns (x1.7 while the boss is on screen)
  OBST_SPEED: 0.22,         // obstacles drift at this fraction of the water flow at their height (user: 'muuuch slower')
  OBST_H: [0.06, 0.88],     // face height band they spawn in (0 trough .. 1 crest)
  OBST_BOB: 6,              // px bob amplitude
  BOSS_SIZE: 0.80,          // boss height as a fraction of Mikey's height
  BOSS_EVERY: [20, 30],     // s between visits (press B to summon now)
  BOSS_STAY: [8, 12],       // s hovering per visit
  BOSS_POS: { x: [0.65, 0.85], y: 0.13 },   // hover zone (screen fractions; y = sky above the crest)
  BOSS_SHOTS: [2, 4],       // projectiles per visit
  WINDUP: 0.6,              // s telegraph before each shot
  PROJ_TIME: [1.2, 1.6],    // s for a projectile to reach where the rider was when it fired
  PROJ_R: 0.026,            // projectile radius (fraction of screen height)
  INVULN: 0.9,              // s of invulnerability after a hit
  KNOCK_V: 0.55,            // physics: downward knock on hit (rail/s)
  // --- pickups -> ammo clip -> shooting the boss while airborne ---
  PICK_GAP: [2.6, 4.4],     // s between pickup strings
  PICK_N: [4, 7],           // pickups per string
  PICK_SPACING: 0.05,       // screen widths between pickups in a string
  PICK_SPEED: 0.30,         // face strings drift at this fraction of the water flow (obstacles use 0.22)
  PICK_AIR_CHANCE: 0.35,    // chance a string is an arc over the lip (only reachable by jumping)
  PICK_SPECIAL: 0.30,       // chance a string ends in a special (nunchaku for Mikey)
  PICK_SIZE: 0.30,          // pickup size as a fraction of Mikey's height
  CLIP_MAX: 12,             // ammo clip capacity
  FIRE_RATE: 4,             // shots per second while airborne
  FIRE_NEEDS_BOSS: true,    // only fire when the boss is on screen (otherwise ammo is kept)
  SHOT_SPEED: 0.55,         // screen widths / s (stars); specials fly at 0.75x and spin (user: bigger + slower)
  SHOT_SIZE: 1.3,           // thrown star radius vs a pickup's
  BOSS_HP: 14,              // star = 1 damage, special = 3
  SPECIAL_DMG: 3,
  JET_ENABLED: false,       // water (jetski) boss switched off for now (user)
  JET_SIZE: 1.05,           // water boss (jetski) height vs Mikey's
  JET_X: [0.66, 0.80],      // water boss rides here (screen fraction)
  FLAT_ZONE: 0.5,           // rider above this screen fraction (upper half) -> boss swoops to his height and fires FLAT (0 deg); rider stars fly flat, no homing
  SWOOP_RATE: 5,            // 1/s: how fast the boss slides to the firing lane
};
// flow speed by face height in screen-widths/s (same curve as the level-2 shader flow)
const flowAt = hh => (2.05 + (0.5 - 2.05) * Math.pow(Math.min(1, Math.max(0, hh / 0.95)) ** 2 * (3 - 2 * Math.min(1, Math.max(0, hh / 0.95))), 1.5)) / 1.778;

// ---- sprite slots: PNGs win if present in this folder, otherwise ink-outlined placeholders ----
const INK = '#120a1e';
function slot(file, makePlaceholder) {
  const o = { img: null, ph: makePlaceholder() }; const im = new Image();
  im.onload = () => { if (im.naturalWidth > 0) o.img = im; }; im.src = file; return o;
}
const canvasOf = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d')); return c; };
function blobPH(body, hair, band) {
  return canvasOf(300, 320, g => {
    g.lineCap = 'round'; g.lineJoin = 'round';
    const tent = [[150, 95, 70, 40], [150, 90, 120, 20], [150, 90, 185, 25], [155, 95, 240, 50], [140, 100, 45, 110], [165, 100, 262, 120], [150, 90, 150, 10]];
    for (const [x0, y0, x1, y1] of tent) { g.strokeStyle = INK; g.lineWidth = 40; g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo((x0 + x1) / 2 + 20, (y0 + y1) / 2 - 25, x1, y1); g.stroke(); }
    for (const [x0, y0, x1, y1] of tent) { g.strokeStyle = hair; g.lineWidth = 28; g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo((x0 + x1) / 2 + 20, (y0 + y1) / 2 - 25, x1, y1); g.stroke(); }
    g.fillStyle = body; g.strokeStyle = INK; g.lineWidth = 9;
    g.beginPath(); g.ellipse(150, 210, 98, 112, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = 'rgba(0,0,0,0.18)'; g.beginPath(); g.ellipse(185, 230, 55, 85, 0, 0, Math.PI * 2); g.fill();   // hard shadow tone
    if (band) { g.fillStyle = band; g.strokeStyle = INK; g.lineWidth = 6; g.fillRect(85, 112, 130, 20); g.strokeRect(85, 112, 130, 20); }
    for (const ex of [115, 185]) { g.fillStyle = '#fff6d8'; g.beginPath(); g.ellipse(ex, 180, 26, 22, 0, 0, Math.PI * 2); g.fill(); g.lineWidth = 6; g.stroke();
      g.lineWidth = 7; g.beginPath(); g.moveTo(ex - 10, 170); g.lineTo(ex + 10, 190); g.moveTo(ex + 10, 170); g.lineTo(ex - 10, 190); g.stroke(); }
    g.lineWidth = 7; g.beginPath(); g.arc(150, 265, 30, Math.PI * 1.15, Math.PI * 1.85); g.stroke();      // frown
  });
}
const bossPH = () => canvasOf(300, 380, g => {
  g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = INK; g.lineWidth = 9;
  g.fillStyle = '#1b1c22'; g.beginPath(); g.moveTo(105, 225); g.lineTo(195, 225); g.lineTo(210, 300); g.lineTo(90, 300); g.closePath(); g.fill(); g.stroke();   // tracksuit top
  for (const [x0, x1] of [[120, 105], [180, 195]]) { g.beginPath(); g.moveTo(x0, 300); g.lineTo(x1, 365); g.lineWidth = 34; g.strokeStyle = INK; g.stroke(); g.lineWidth = 24; g.strokeStyle = '#1b1c22'; g.stroke(); g.lineWidth = 5; g.strokeStyle = '#00c9ff'; g.stroke(); }   // legs + cyan stripe
  g.strokeStyle = INK; g.lineWidth = 30; g.beginPath(); g.moveTo(105, 235); g.lineTo(55, 290); g.moveTo(195, 235); g.lineTo(250, 285); g.stroke();
  g.strokeStyle = '#1b1c22'; g.lineWidth = 20; g.stroke(); g.strokeStyle = '#00c9ff'; g.lineWidth = 4; g.stroke();   // arms
  g.fillStyle = '#d98a2b'; g.strokeStyle = INK; g.lineWidth = 7; for (const [x, y] of [[55, 292], [250, 288], [105, 368], [195, 368]]) { g.beginPath(); g.arc(x, y, 13, 0, 7); g.fill(); g.stroke(); }
  g.fillStyle = '#ffd400'; g.lineWidth = 8; g.beginPath(); g.moveTo(120, 50); g.lineTo(175, 2); g.lineTo(165, 45); g.lineTo(205, 40); g.closePath(); g.fill(); g.stroke();   // hair spike
  g.fillStyle = '#d98a2b'; g.lineWidth = 9; g.beginPath(); g.arc(150, 130, 100, 0, Math.PI * 2); g.fill(); g.stroke();   // big head
  g.fillStyle = 'rgba(0,0,0,0.15)'; g.beginPath(); g.arc(185, 150, 70, -0.6, 1.9); g.fill();
  for (const ex of [105, 185]) { g.fillStyle = '#fff3c4'; g.beginPath(); g.ellipse(ex, 135, 30, 24, 0, 0, 7); g.fill(); g.stroke(); g.fillStyle = INK; g.beginPath(); g.arc(ex - 4, 138, 7, 0, 7); g.fill(); }
  g.lineWidth = 9; g.beginPath(); g.moveTo(70, 100); g.lineTo(135, 118); g.moveTo(225, 100); g.lineTo(160, 118); g.stroke();   // angry brows
  g.lineWidth = 7; g.beginPath(); g.arc(150, 200, 22, Math.PI * 1.2, Math.PI * 1.8); g.stroke();
});
const SPR = { a: slot('obstacle_a.png', () => blobPH('#b5643c', '#f0a640', null)), b: slot('obstacle_b.png', () => blobPH('#c9c24a', '#9fd9b0', '#c8323c')),
  boss: slot('boss.png', bossPH), proj: slot('projectile.png', () => canvasOf(120, 120, g => { g.fillStyle = '#00ff1e'; g.strokeStyle = INK; g.lineWidth = 9;
    g.beginPath(); g.arc(60, 60, 48, 0, 7); g.fill(); g.stroke(); g.fillStyle = '#c8ffb0'; g.beginPath(); g.arc(45, 45, 14, 0, 7); g.fill(); })) };
const sprImg = o => o.img || o.ph;

const game = { hits: 0, dodged: 0, obst: [], proj: [], nextObst: 2.0, invuln: 0, flash: 0, knockTilt: 0,
  boss: { state: 'away', t: 0, next: 20 + Math.random() * 10, x: 0, y: 0, tx: 0, shots: [], fired: 0, windup: 0, stay: 10 }, projTimes: [], clock: 0 };
game.picks = []; game.clip = []; game.shots = []; game.pops = []; game.nextPick = 1.2; game.fireCd = 0; game.collected = 0; game.bossHits = 0; game.bossKills = 0;
game.boss.hp = GAME.BOSS_HP; game.boss.flash = 0;
// water boss: rides the face with the SAME physics as the player (AI holds the one input), jumps off the lip, shoots the same way
game.jet = { state: 'away', next: 34 + Math.random() * 10, t: 0, x: 0, y: 0, s: 0.3, v: 0, holdT: 0, air: false, airH: 0, airV: 0, airG: 1, airT: 0,
  tgt: 0.4, tgtT: 0, hp: GAME.BOSS_HP, flash: 0, shots: [], fired: 0, windup: 0, stay: 12, tilt: 0, spin: 0, cx: 0, cy: 0 };
SPR.jet = slot('jetski_boss.png', bossPH);
window.__game = game;
window.__spawnPicks = (air, xFrac) => spawnPicks(air, xFrac);
const PSPR = { star: slot('shuriken.png', () => null), special: slot('nunchaku.png', () => null) };
function drawShuriken(x, y, r, rot) {   // 4-point steel star, ink outline, toon highlight
  const im = PSPR.star.img; if (im) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(im, -r, -r, 2 * r, 2 * r); ctx.restore(); return; }
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.lineJoin = 'miter';
  const tip = r, inn = r * 0.30;
  const starPath = () => { ctx.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 === 0 ? tip : inn; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); };
  for (let k = 0; k < 4; k++) {   // each blade: lit half + shadow half (toon facets)
    const a = k * Math.PI / 2, a1 = a - Math.PI / 4, a2 = a + Math.PI / 4;
    ctx.fillStyle = '#dfe8f0'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a1) * inn, Math.sin(a1) * inn); ctx.lineTo(Math.cos(a) * tip, Math.sin(a) * tip); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8796a8'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * tip, Math.sin(a) * tip); ctx.lineTo(Math.cos(a2) * inn, Math.sin(a2) * inn); ctx.closePath(); ctx.fill();
  }
  starPath(); ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, r * 0.14); ctx.stroke();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(0, 0, r * 0.13, 0, 7); ctx.fill();
  ctx.restore();
}
function drawNunchaku(x, y, r, rot) {   // two orange-wrapped sticks on a short chain
  const im = PSPR.special.img; if (im) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(im, -r, -r, 2 * r, 2 * r); ctx.restore(); return; }
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const L = r * 1.15, Wd = r * 0.36;
  const stick = (ang, ox) => { ctx.save(); ctx.translate(ox, -r * 0.05); ctx.rotate(ang);
    ctx.fillStyle = '#9a5a2b'; ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, r * 0.12);
    ctx.beginPath(); ctx.roundRect(-Wd / 2, 0, Wd, L, Wd / 2); ctx.fill();
    ctx.fillStyle = '#f15a24'; for (const f of [0.35, 0.6]) ctx.fillRect(-Wd / 2, L * f, Wd, L * 0.12);
    ctx.beginPath(); ctx.roundRect(-Wd / 2, 0, Wd, L, Wd / 2); ctx.stroke(); ctx.restore(); };
  stick(0.55, -r * 0.18); stick(-0.55, r * 0.18);
  ctx.strokeStyle = '#3a3444'; ctx.lineWidth = Math.max(2, r * 0.09); ctx.beginPath(); ctx.moveTo(-r * 0.18, -r * 0.05); ctx.quadraticCurveTo(0, -r * 0.45, r * 0.18, -r * 0.05); ctx.stroke();
  ctx.restore();
}
const drawAmmo = (type, x, y, r, rot) => type === 'special' ? drawNunchaku(x, y, r, rot) : drawShuriken(x, y, r, rot);
function spawnPicks(air, xFrac) {
  const W = innerWidth, n = Math.round(rand([GAME.PICK_N[0], GAME.PICK_N[1] + 0.99]));
  const special = Math.random() < GAME.PICK_SPECIAL, x0 = (xFrac ?? 1.08) * W;
  if (air ?? (Math.random() < GAME.PICK_AIR_CHANCE)) {
    for (let i = 0; i < n; i++) game.picks.push({ air: true, i, n, x: x0 + i * GAME.PICK_SPACING * W, type: special && i === n - 1 ? 'special' : 'star', ph: Math.random() * 6 });
  } else {
    const h0 = 0.15 + Math.random() * 0.6, slope = (Math.random() - 0.5) * 0.12;
    for (let i = 0; i < n; i++) game.picks.push({ air: false, h: Math.min(0.92, Math.max(0.06, h0 + slope * i + 0.04 * Math.sin(i * 0.9))), x: x0 + i * GAME.PICK_SPACING * W, type: special && i === n - 1 ? 'special' : 'star', ph: Math.random() * 6 });
  }
}
window.__noSpawn = false;
window.__spawnObstacle = (hh, xFrac) => { game.obst.push({ x: (xFrac ?? 1.1) * innerWidth, h: hh, type: Math.random() < 0.5 ? 'a' : 'b', ph: Math.random() * 6.3, hit: false, passed: false }); };
window.__summonBoss = () => { if (game.boss.state === 'away' && game.jet.state === 'away') game.boss.next = 0; };
window.__summonJet = () => { if (GAME.JET_ENABLED && game.boss.state === 'away' && game.jet.state === 'away') game.jet.next = 0; };
const rand = ([a, b]) => a + Math.random() * (b - a);
const peakBodyY = H => PHYS.AIR_PEAK_Y * H - 0.45 * (H / 1080 * 205);   // rider body centre at the top of a (locked) jump

function crestAt(x, W, rail, line) {   // live riding-range top (screen px) at screen x
  if (!line || line.length < 2) return rail.yCrest;
  const f = Math.min(line.length - 1, Math.max(0, x / W * (line.length - 1))), i = Math.floor(f), j = Math.min(line.length - 1, i + 1);
  return line[i] + (line[j] - line[i]) * (f - i);
}
function onHit(x, y, W, H) {
  if (game.invuln > 0) return;
  game.hits++; game.invuln = GAME.INVULN; game.flash = 0.14; game.knockTilt = 0.55;
  if (mode === 'Physics') { if (air) { airV = Math.min(airV, 0); } else sVel = Math.min(sVel, -GAME.KNOCK_V); }
  else h = Math.max(0, h - 0.1);
  burst(x, y, 26, 700, W, H);
}
function updateGame(dt, W, H, rail, line, body) {
  game.clock += dt; game.invuln = Math.max(0, game.invuln - dt); game.flash = Math.max(0, game.flash - dt); game.knockTilt *= Math.exp(-dt * 5);
  const sprH = H / 1080 * 205;
  // --- obstacles ---
  game.nextObst -= dt;
  if (game.nextObst <= 0 && !window.__noSpawn) { window.__spawnObstacle(rand(GAME.OBST_H)); game.nextObst = rand(GAME.OBST_GAP) * (game.boss.state === 'away' ? 1 : 1.7); }
  const yTr = rail.yTrough;
  for (let i = game.obst.length - 1; i >= 0; i--) {
    const o = game.obst[i]; o.x -= flowAt(o.h) * GAME.OBST_SPEED * W * dt;
    o.size = GAME.OBST_SIZE * sprH;
    o.y = yTr - o.h * (yTr - crestAt(o.x, W, rail, line)) + Math.sin(game.clock * 2.4 + o.ph) * GAME.OBST_BOB * H / 1080;   // waterline
    const cx = o.x, cy = o.y - 0.38 * o.size;
    if (!o.hit && Math.hypot(cx - body.x, cy - body.y) < body.r + 0.30 * o.size) { o.hit = true; onHit(cx, cy, W, H); }
    if (!o.passed && o.x < body.x - body.r) { o.passed = true; if (!o.hit) game.dodged++; }
    if (o.x < -o.size) game.obst.splice(i, 1);
  }
  // --- boss ---

}
function drawProjectiles(H) {
  const r = GAME.PROJ_R * H;
  for (const p of game.proj) {
    if (SPR.proj.img) {   // projectile.png: ball at ~(0.33, 0.5) of the image, radius ~0.25 of its width, tail pointing right (= flying left)
      const im = SPR.proj.img, k = r / (0.25 * im.width);

const frames = [null, L1, L2]; const NLEV = 2;
const qs = new URLSearchParams(location.search);
let cur = +(qs.get('level') || 1);
let mode = qs.get('ctl') === 'direct' ? 'Direct' : 'Physics';
function setLevel(n) {
  cur = n;
  for (let i = 1; i <= NLEV; i++) {
    frames[i].classList.toggle('on', i === n);
    try { frames[i].contentWindow.__paused = i !== n; } catch {}
  }
  document.querySelectorAll('#bar button[data-l]').forEach(b => b.classList.toggle('on', +b.dataset.l === n));
  wake.length = 0; trailPrev = null;
}
function setMode(m) {
  mode = m; ctlBtn.textContent = 'C · ' + m;
  hint.textContent = (m === 'Physics'
    ? 'PHYSICS: hold Space / Up / mouse / touch to push up the face, release to drop · launch off the lip'
    : 'DIRECT: Up / Down (W / S) set height on the face · auto-rides when idle') + ' · 1 / 2 level · C controller';
  sVel = 0; air = false;
}
const ctlBtn = document.getElementById('ctl'), hint = document.getElementById('hint'), hud = document.getElementById('hud');
document.querySelectorAll('#bar button[data-l]').forEach(b => b.onclick = e => { e.stopPropagation(); setLevel(+b.dataset.l); });
ctlBtn.onclick = e => { e.stopPropagation(); setMode(mode === 'Physics' ? 'Direct' : 'Physics'); };
document.getElementById('bar').addEventListener('pointerdown', e => e.stopPropagation());
for (let i = 1; i <= NLEV; i++) frames[i].addEventListener('load', () => setLevel(cur));

// ---------- input ----------
let up = false, dn = false, lastKey = -1e9, holdKey = false, holdPtr = false;
window.__hold = undefined;   // scripted override for tests
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= String(NLEV)) setLevel(+e.key);
  if (e.key === 'b' || e.key === 'B') window.__summonBoss();
  if (e.key === 'n' || e.key === 'N') window.__summonJet();
  if (e.key === 'c' || e.key === 'C') setMode(mode === 'Physics' ? 'Direct' : 'Physics');
  if (e.key === 'ArrowUp' || e.key === 'w') up = true;
  if (e.key === 'ArrowDown' || e.key === 's') dn = true;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') holdKey = true;
  lastKey = performance.now();
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowUp' || e.key === 'w') up = false;
  if (e.key === 'ArrowDown' || e.key === 's') dn = false;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') holdKey = false;

addEventListener('pointerdown', () => holdPtr = true);
addEventListener('pointerup', () => holdPtr = false);
addEventListener('pointercancel', () => holdPtr = false);
const holding = () => window.__hold !== undefined ? window.__hold : (holdKey || holdPtr);

// ---------- rider state ----------
let h = 0.5;                       // height on face 0..1 (what the level draws the face point for)
let sPos = 0, sVel = 0, air = false, airT = 0, airH = 0, airV = 0, airG = 1;   // physics: rail position / velocity; air height above lip (px), its velocity (px/s) and gravity (px/s^2)
let tilt = 0, lastY = null, vyScreen = 0, holdT = 0, airTilt0 = 0, airTp = 0.6;

const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
const img = new Image(); img.src = 'mikey_surf.png';
const ANCHOR = { x: 0.57, y: 0.90 };   // board contact point inside the 768x638 sprite
const TAIL = { x: 0.20, y: 0.86 };      // board tail inside the sprite
const wake = []; let trailPrev = null;
const lines = Array.from({ length: 9 }, () => ({ x: Math.random(), y: 0.58 + Math.random() * 0.4, len: 0.05 + Math.random() * 0.09, v: 1.3 + Math.random() * 0.6 }));

function burst(x, y, n, up, W, H) {   // launch spray / landing splash: opaque white + pale cyan so it reads on the purple sky
  for (let i = 0; i < n; i++) wake.push({ x, y, vx: -W * (0.2 + Math.random() * 0.5), vy: -(up * (0.5 + Math.random())) * H / 1080,
    r: (4 + Math.random() * 8) * H / 1080, age: 0, life: 0.35 + Math.random() * 0.3, g: 1500 * H / 1080, dir: 0, burst: true });
}

function stepPhysics(dt, W, H) {

        const rise = Math.max(12, (r ? r.yCrest : H * 0.3) - P.AIR_PEAK_Y * H);
        const T = P.AIR_TIME;

    }

    airT += dt; airV -= airG * dt; airH += airV * dt;

      air = false; airH = 0; sPos = 0.97; const rl = window.__railNow; sVel = (airV / Math.max(40, rl ? rl.yTrough - rl.yCrest : H * 0.6)) * P.LAND_KEEP;
      const r = window.__railNow; if (r) burst(r.x1, r.yCrest, 30, 650, W, H);

function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  const W = fx.width = innerWidth, H = fx.height = innerHeight;
  stepPhysics(dt, W, H);
  for (let i = 1; i <= NLEV; i++) { try { frames[i].contentWindow.__H = h; } catch {} }
  ctx.clearRect(0, 0, W, H);
  let rs = null, rail = null, curtain = null, crestLine = null;
  try { const cw = frames[cur].contentWindow; rs = cw.__riderScreen; rail = cw.__rail; curtain = cw.__curtain; crestLine = cw.__crestLine; } catch {}
  // occlusion: wake, speed lines and shadow live BEHIND the falling curtain -> clip to the region right of it
  ctx.save(); clipBehindCurtain(curtain, W, H);
  window.__railNow = rail;
  speedLines(dt, W, H);
  if (!rs || !rail || !img.complete) { ctx.restore(); requestAnimationFrame(frame); return; }
  const railPx = Math.max(40, rail.yTrough - rail.yCrest);
  const s = (H / 1080) * 205 / img.height;   // ~205 px tall at 1080p
  // board contact point: on the face, or above the lip in the air
  let bx = rs.x, by = rs.y;
  if (air) { bx = rail.x1; by = rail.yCrest - airH;
    const minY = ANCHOR.y * img.height * s + PHYS.AIR_TOP_MARGIN * H / 1080;   // keep the sprite on screen

  else target = -Math.atan2(airV, PHYS.AIR_VX * H / 1080);   // parabolic: board follows the arc (nose up rising, level at the top, nose down falling)

  } else tilt += (target - tilt) * Math.min(1, dt * 8);

  const body = { x: bx - 0.05 * img.width * s, y: by - 0.45 * img.height * s, r: 0.27 * img.height * s };
  updateGame(dt, W, H, rail, crestLine, body);

        vx: -W * WAKE.FLOW * (0.85 + Math.random() * 0.3), vy: 0, dir: Math.random() * 2 - 1,
        r: (5 + Math.random() * 7) * H / 1080, age: -dt * (1 - f), life: WAKE.LIFE * (0.7 + Math.random() * 0.6), g: 0 });
    }
    trailPrev = tail;
  } else trailPrev = null;

    const p = wake[i]; p.age += dt; if (p.age > p.life) { wake.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += (p.vy + p.dir * WAKE.SPREAD * (H / 1080) * (p.age / p.life)) * dt; p.vy += p.g * dt;
  }

    const a = 1 - p.age / p.life;
    const r = p.burst ? p.r * (0.4 + 0.6 * a) : p.r * (1 + WAKE.GROW * (p.age / p.life));   // spray droplets shrink, wake foam spreads
    if (p.burst) { ctx.globalAlpha = a > 0.25 ? 1 : a * 4; ctx.fillStyle = a > 0.5 ? '#ffffff' : '#c9f4ff'; }
    else { ctx.globalAlpha = Math.min(1, 1.6 * a * a); ctx.fillStyle = a > 0.5 ? '#ffffff' : '#e4f7fc'; }
    ctx.beginPath(); ctx.ellipse(p.x, p.y, r * 1.5, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  drawObstacles(H);   // inside the clip: they pass BEHIND the curtain
  drawPicks(H);

  ctx.restore();   // end curtain clip
  // ---- rider sprite (always in front) ----
  ctx.save(); ctx.translate(bx, by); ctx.rotate(tilt + game.knockTilt * Math.sin(game.clock * 40)); ctx.scale(s, s);   // stagger wobble on hit
  if (game.invuln > 0 && Math.floor(game.invuln * 12) % 2 === 0) ctx.globalAlpha = 0.45;                      // invulnerability flicker
  ctx.drawImage(img, -ANCHOR.x * img.width, -ANCHOR.y * img.height);
  if (game.flash > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, game.flash / 0.14); ctx.drawImage(img, -ANCHOR.x * img.width, -ANCHOR.y * img.height); }   // white flash
  ctx.restore();
  drawBoss(H); drawJet(H); drawProjectiles(H); drawShotsAndPops(H); drawClip(W, H);
  window.__dbg = { mode, h, sPos, sVel, air, airH, airV, tilt, bx, by };

}
function clipBehindCurtain(curtain, W, H) {
  if (!curtain || curtain.length < 2) return;

}
function drawShadow(x, y, rx, ry, alpha) {

  g.addColorStop(0, `rgba(8,20,45,${alpha})`); g.addColorStop(0.6, `rgba(8,20,45,${alpha * 0.6})`); g.addColorStop(1, 'rgba(8,20,45,0)');

}
function speedLines(dt, W, H) {
  ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(235,255,250,0.55)'; ctx.lineWidth = Math.max(1.5, H / 540);
  for (const L of lines) {
    L.x -= L.v * (0.7 + (L.y - 0.58) * 1.2) * dt;
    if (L.x + L.len < 0) { L.x = 1 + Math.random() * 0.3; L.y = 0.58 + Math.random() * 0.4; L.len = 0.05 + Math.random() * 0.09; }
    ctx.beginPath(); ctx.moveTo(L.x * W, L.y * H); ctx.lineTo((L.x + L.len) * W, L.y * H); ctx.stroke();
  }

// ===================== dev panel: physics presets + live sliders =====================
const DEV_KEYS = [['GRAVITY', 1, 12, 0.01], ['THRUST', 1, 16, 0.01], ['DAMP', 0.5, 10, 0.05], ['RAMP', 0, 1.5, 0.05], ['RAMP_T', 0.2, 4, 0.1], ['AIR_PEAK_Y', 0.05, 0.4, 0.005], ['AIR_TIME', 0.6, 2.5, 0.05]];
let devPreset = null;
function simFace(P, hold) {   // same integrator as stepPhysics: hold from trough / release at lip, both from rest
  let s0 = hold ? 0 : 1, v = 0, t = 0, th = 0; const dt = 1 / 240;
  while (t < 8) { th = hold ? th + dt : 0; const rp = 1 + (P.RAMP || 0) * Math.min(1, th / (P.RAMP_T || 1));
    v += (-P.GRAVITY + (hold ? P.THRUST * rp : 0) - P.DAMP * v) * dt; s0 += v * dt; t += dt;
    if (hold ? s0 >= 1 : s0 <= 0) return t.toFixed(2) + ' s'; }
  return 'never';
}
function loadCustom() { try { return JSON.parse(localStorage.getItem('wave.phys.custom') || 'null'); } catch { return null; } }
function applyPreset(name) {
  const cfg = name === 'Custom' ? loadCustom() : PHYS_PRESETS[name]; if (!cfg) return;
  Object.assign(PHYS, cfg); devPreset = name; try { localStorage.setItem('wave.phys.preset2', name); } catch {} buildDev();
}
function buildDev() {
  const body = document.getElementById('devbody'); const custom = loadCustom();
  const names = [...Object.keys(PHYS_PRESETS), ...(custom ? ['Custom'] : [])];
  body.innerHTML = names.map(n => `<button data-p="${n}" class="${n === devPreset ? 'on' : ''}">${n}</button>`).join('') +
    DEV_KEYS.map(([k, a, b, st]) => `<label>${k}<input type="range" min="${a}" max="${b}" step="${st}" value="${PHYS[k]}" data-k="${k}"><span id="v_${k}">${(+PHYS[k]).toFixed(3)}</span></label>`).join('') +
    `<div class="meas" id="devmeas"></div><button id="devsave">Save as Custom</button><button id="devcopy">Copy JSON</button>`;
  body.querySelectorAll('button[data-p]').forEach(b => b.onclick = () => applyPreset(b.dataset.p));
  body.querySelectorAll('input[data-k]').forEach(inp => inp.oninput = () => { PHYS[inp.dataset.k] = +inp.value; document.getElementById('v_' + inp.dataset.k).textContent = (+inp.value).toFixed(3); devPreset = null; body.querySelectorAll('button[data-p]').forEach(b => b.classList.remove('on')); devMeasure(); });
  document.getElementById('devsave').onclick = () => { const o = {}; DEV_KEYS.forEach(([k]) => o[k] = PHYS[k]); try { localStorage.setItem('wave.phys.custom', JSON.stringify(o)); } catch {} devPreset = 'Custom'; buildDev(); };
  document.getElementById('devcopy').onclick = () => { const o = {}; DEV_KEYS.forEach(([k]) => o[k] = PHYS[k]); navigator.clipboard?.writeText(JSON.stringify(o)); };
  devMeasure();
}
function devMeasure() {
  const P = PHYS; document.getElementById('devmeas').innerHTML =
    `climb trough→lip: ${simFace(P, true)}<br>drop lip→trough: ${simFace(P, false)}<br>fall speed max: ${(P.GRAVITY / P.DAMP).toFixed(2)} rail/s`;
}
{ const dev = document.getElementById('dev');
  dev.addEventListener('pointerdown', e => e.stopPropagation());   // panel clicks are not "hold"
  document.getElementById('devx').onclick = () => { dev.classList.toggle('min'); document.getElementById('devx').textContent = dev.classList.contains('min') ? '+' : '–'; };
  addEventListener('keydown', e => { if (e.key === '`') dev.style.display = dev.style.display === 'none' ? '' : 'none'; });
  let start = DEFAULT_PRESET; try { const sv = localStorage.getItem('wave.phys.preset2'); if (sv && (PHYS_PRESETS[sv] || (sv === 'Custom' && loadCustom()))) start = sv; } catch {}
  applyPreset(start); }
let prev = performance.now();
setMode(mode);
requestAnimationFrame(frame);
