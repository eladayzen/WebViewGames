<!doctype html>
<html><head><meta charset="utf-8"><title>Wave Levels</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;visibility:hidden}
  iframe.on{visibility:visible}
  #fx{position:absolute;inset:0;pointer-events:none}
  #bar{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
  #bar button{font:800 18px system-ui;padding:10px 18px;border:3px solid #120a1e;border-radius:10px;
    background:#ffd400;color:#120a1e;box-shadow:3px 3px 0 #120a1e;cursor:pointer}
  #bar button.on{background:#00ff1e}
  #hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#fff;font:600 14px system-ui;
    text-shadow:0 1px 2px #000;z-index:5;opacity:.8}
</style></head><body>
<iframe id="L1" src="level-1.html"></iframe>
<iframe id="L2" src="level-2.html"></iframe>
<iframe id="L3" src="level-3.html"></iframe>
<canvas id="fx"></canvas>
<div id="bar"><button data-l="1">1 3D Toon</button><button data-l="2">2 SDF Ink</button><button data-l="3">3 Ooze Street</button></div>
<div id="hint">1 / 2 / 3 switch level · ↑ ↓ (or W S) ride up / down the face · auto-rides when idle</div>
<script>
const frames = [null, L1, L2, L3];
let cur = +(new URLSearchParams(location.search).get('level') || 1);
function setLevel(n) {
  cur = n;
  for (let i = 1; i <= 3; i++) {
    frames[i].classList.toggle('on', i === n);
    try { frames[i].contentWindow.__paused = i !== n; } catch {}
  }
  document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', +b.dataset.l === n));
  vy = 0; lastY = null;
}
document.querySelectorAll('#bar button').forEach(b => b.onclick = () => setLevel(+b.dataset.l));
for (let i = 1; i <= 3; i++) frames[i].addEventListener('load', () => setLevel(cur));

// height on face: arrows / WS, auto-sine when idle (same rule as the protos)
let h = 0.5, up = false, dn = false, lastKey = -1e9;
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '3') setLevel(+e.key);
  if (e.key === 'ArrowUp' || e.key === 'w') up = true;
  if (e.key === 'ArrowDown' || e.key === 's') dn = true;
  lastKey = performance.now();
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowUp' || e.key === 'w') up = false;
  if (e.key === 'ArrowDown' || e.key === 's') dn = false;
});

// rider sprite on a 2D overlay, placed where the active level says the face is
const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
const img = new Image(); img.src = 'mikey_surf.png';
const ANCHOR = { x: 0.57, y: 0.90 };   // board contact point inside the 768x638 sprite
let t0 = performance.now(), prev = t0, lastY = null, vy = 0, tilt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now; const t = (now - t0) / 1000;
  if (up || dn || now - lastKey < 2000) h = Math.min(1, Math.max(0, h + ((up ? 1 : 0) - (dn ? 1 : 0)) * dt * 1.2));
  else h = 0.5 + 0.5 * Math.sin(t * 0.9);
  for (let i = 1; i <= 3; i++) { try { frames[i].contentWindow.__H = h; } catch {} }
  if (fx.width !== innerWidth || fx.height !== innerHeight) { fx.width = innerWidth; fx.height = innerHeight; }
  ctx.clearRect(0, 0, fx.width, fx.height);
  let rs = null; try { rs = frames[cur].contentWindow.__riderScreen; } catch {}
  if (rs && img.complete) {
    // board tilt follows the face: nose up while climbing, nose down while dropping
    if (lastY !== null && dt > 0) vy = vy * 0.85 + ((rs.y - lastY) / dt) * 0.15;
    lastY = rs.y;
    const target = Math.max(-0.45, Math.min(0.45, vy / fx.height * 1.6)) + 0.04 * Math.sin(t * 3.1);
    tilt += (target - tilt) * Math.min(1, dt * 8);
    const s = (fx.height / 1080) * 205 / img.height;   // ~205 px tall at 1080p
    ctx.save(); ctx.translate(rs.x, rs.y); ctx.rotate(tilt); ctx.scale(s, s);
    ctx.drawImage(img, -ANCHOR.x * img.width, -ANCHOR.y * img.height);
    ctx.restore();
    window.__dbg = { x: rs.x, y: rs.y, tilt, h };
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
