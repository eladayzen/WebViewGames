<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<script>
      // GoBalance SDK integration — see ../GOBALANCE_SDK.md for the full contract this depends
      // on. Everything below is a no-op outside the Unity WebView (guarded by
      // `if (window.Unity)` / feature checks), so it's always safe to ship, including when
      // testing in a normal browser.

      // The only channel for JS errors on-device — there's no devtools console inside the
      // WebView, so surface them through the native bridge instead.
      window.addEventListener('error', function (e) {
        if (window.Unity) window.Unity.call('JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (window.Unity) window.Unity.call('JS UNHANDLED REJECTION: ' + e.reason);
      });

      // rAF shim: WKWebView treats the occluded Unity overlay as a background tab and
      // suspends requestAnimationFrame entirely. Queue callbacks instead of scheduling them
      // natively; Unity's WebGameController flushes the queue via window.__pumpFrames() every
      // frame (~60Hz) regardless of tab visibility. A real native rAF loop keeps running
      // underneath too, so a normal browser (testing outside Unity) behaves exactly as before.
      (function () {
        var nativeRAF = window.requestAnimationFrame.bind(window);
        window.__rafQueue = [];
        window.requestAnimationFrame = function (cb) { window.__rafQueue.push(cb); return window.__rafQueue.length; };
        window.cancelAnimationFrame = function () {};
        window.__pumpFrames = function () {
          var q = window.__rafQueue;
          if (!q.length) return;
          window.__rafQueue = [];
          var t = performance.now();
          for (var i = 0; i < q.length; i++) {
            try { q[i](t); }
            catch (e) {
              // ON-DEVICE this is the only channel there is: no console exists
              // inside the WebView, so the native bridge is it.
              if (window.Unity) window.Unity.call('RAF CB ERROR: ' + e.message);
              // IN A BROWSER, `window.Unity` is undefined, so this catch used to
              // discard the exception entirely -- every frame, forever. A typo in
              // the frame callback then presented as a game that simply stopped
              // advancing with a clean console, which is indistinguishable from a
              // design problem and is exactly how a broken build gets waved
              // through on a dev server. Re-raising is not an option (it would
              // break the pump), so it is logged instead.
              else if (typeof console !== 'undefined' && console.error) {
                console.error('RAF CB ERROR:', e);
              }
            }
          }
        };
        (function nativeLoop() { nativeRAF(function () { window.__pumpFrames(); nativeLoop(); }); })();
      })();
    </script>
    <title>Bloop Squad</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The X is the only way out of a game on the board. The inline handler is
         the fallback for a build whose module failed to load: a game that
         cannot boot must still be escapable. -->
    <!-- CHROME ROW, TOP RIGHT: quit, pause, settings -- the house format, and
         the same order in every game so a player who learns one knows them all.
         Hearts sit on the OTHER side (drawn on the canvas) so the two never
         crowd each other and neither has to move when the other grows. -->
    <div id="chrome">
      <button id="gb-back" type="button" aria-label="Quit"
              onclick="(window.__gbBack ? window.__gbBack() : (window.Unity &amp;&amp; window.Unity.call('nav:back')))">&#10005;</button>
      <button id="pause-button" type="button" aria-label="Pause">&#10074;&#10074;</button>
    </div>

    <div id="stage"><canvas id="game"></canvas></div>

    <!-- QUIT CONFIRM. A modal over the PAUSED playfield, not a screen: the
         player has to see the run they are being asked to abandon, so this must
         not paint over the field. Only ever shown mid-run -- asking "are you
         sure?" over a screen the player already chose to be on is noise. -->
    <div id="confirm-overlay" class="modal-overlay hidden">
      <div class="board-card">
        <div class="board-title">QUIT?</div>
        <div class="board-sub">Your score still counts.</div>
        <div class="board-buttons">
          <button id="confirm-stay" type="button">KEEP PLAYING</button>
          <button id="confirm-quit" type="button">QUIT</button>
        </div>
      </div>
    </div>

    <!-- THE QUIT BOARD, shown after confirming. Its OWN ids (quit-again /
         quit-leave), deliberately NOT #gameover-overlay / #restart-button:
         the host synth-clicks #restart-button whenever an element with the id
         #gameover-overlay is visible, so reusing them here would fire a restart
         behind these buttons. No timer either -- the player chose to stop, and
         a screen they pressed a button to reach should wait for them. -->
    <div id="quit-overlay" class="board-screen hidden">
      <div class="board-card">
        <div id="quit-title" class="board-title">RUN ENDED</div>
        <div id="quit-stats" class="board-sub"></div>
        <div id="quit-scoreboard" class="hidden">
          <div id="quit-scoreboard-title">BEST RUNS</div>
          <ol id="quit-scoreboard-rows"></ol>
        </div>
        <div class="board-buttons">
          <button id="quit-again" type="button">PLAY AGAIN</button>
          <button id="quit-leave" type="button">QUIT</button>
        </div>
      </div>
    </div>

    <!-- The host synth-clicks #restart-button whenever an element with the id
         #gameover-overlay is visible, so exactly one of each may exist and no
         other screen may reuse these ids. -->
    <div id="gameover-overlay" class="hidden">
      <div id="gameover-card">
        <h1>OOPS!</h1>
        <p id="gameover-stats"></p>
        <!-- The family board. Hidden outside the app and when empty, and
             deliberately ABOVE #restart-button: the host synth-clicks that
             button while this overlay is visible, so the reading order has to
             put the board before the thing that dismisses it. -->
        <div id="scoreboard" class="hidden">
          <div id="scoreboard-title">BEST RUNS</div>
          <ol id="scoreboard-rows"></ol>
        </div>
        <button id="restart-button" type="button">PLAY AGAIN</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
