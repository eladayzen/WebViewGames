<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // GoBalance SDK integration — see ../GOBALANCE_SDK.md for the full contract this depends
      // on. Everything below is a no-op outside the Unity WebView (guarded by
      // `if (window.Unity)` / feature checks), so it's always safe to ship, including when
      // testing in a normal browser.

      // The only channel for JS errors on-device — there's no devtools console inside the
      // WebView, so surface them through the native bridge instead.
      window.addEventListener('error', function (e) {
        if (window.Unity) window.Unity.call('JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (window.Unity) window.Unity.call('JS UNHANDLED REJECTION: ' + e.reason);
      });

      // rAF shim: WKWebView treats the occluded Unity overlay as a background tab and
      // suspends requestAnimationFrame entirely. Queue callbacks instead of scheduling them
      // natively; Unity's WebGameController flushes the queue via window.__pumpFrames() every
      // frame (~60Hz) regardless of tab visibility.
      (function () {
        var nativeRAF = window.requestAnimationFrame.bind(window);
        window.__rafQueue = [];
        window.requestAnimationFrame = function (cb) { window.__rafQueue.push(cb); return window.__rafQueue.length; };
        window.cancelAnimationFrame = function () {};
        window.__pumpFrames = function () {
          var q = window.__rafQueue;
          if (!q.length) return;
          window.__rafQueue = [];
          var t = performance.now();
          for (var i = 0; i < q.length; i++) {
            try { q[i](t); }
            catch (e) { if (window.Unity) window.Unity.call('RAF CB ERROR: ' + e.message); }
          }
        };
        // Only self-drive __pumpFrames() via a real native rAF loop OUTSIDE
        // Unity (normal browser dev/testing), where nothing else calls it.
        // Inside the actual GoBalance WebView, window.Unity is present and
        // WebGameController.cs's Update() loop already calls __pumpFrames()
        // on its own single ~60Hz-capped clock (see GOBALANCE_SDK.md) --
        // running both drivers at once means two unsynchronized clocks
        // racing to flush the same queue, which reads as frame-pacing
        // jitter/stutter rather than a clean 60fps. TmntSkateSlice-local
        // change (2026-07-26, chasing a reported in-WebView lag) -- each
        // game gets its own copy of this shim pasted into its own
        // index.html, so this doesn't touch WebGameController.cs or any
        // other already-shipped game.
        if (!window.Unity) {
          (function nativeLoop() { nativeRAF(function () { window.__pumpFrames(); nativeLoop(); }); })();
        }
      })();
    </script>
    <title>TMNT: Skate &amp; Slice</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="renderCanvas"></canvas>

      <!-- GoBalance SDK: native-bridge Back button. Returns to the SDK games list.
           Cross-game HUD convention (see BUILD_NOTES.md): back + pause live top-right
           as icon-only buttons, back is a plain X, score/status live top-left.
           absolute (not fixed) -- positioned relative to #stage, the locked-aspect
           box, so it stays anchored to the visible game frame, not the raw viewport. -->
      <button id="gb-back"
        onclick="if(window.Unity)window.Unity.call('nav:back');"
        style="position:absolute;top:12px;right:12px;z-index:9999;width:38px;height:38px;border:none;
               border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
               font:600 20px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
               line-height:1;display:flex;align-items:center;justify-content:center;
               -webkit-tap-highlight-color:transparent;">&times;</button>

      <!-- Pause button -- placeholder glyph icon (real icon art later); sits left of
           Back per the same convention. -->
      <button id="pause-button"
        style="position:absolute;top:12px;right:60px;z-index:9999;width:38px;height:38px;border:none;
               border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
               font:600 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
               line-height:1;display:flex;align-items:center;justify-content:center;
               -webkit-tap-highlight-color:transparent;">&#9208;</button>

      <!-- Mute button -- sits left of Pause, same icon-button convention.
           Placeholder glyph icon; starts unmuted (speaker-on). -->
      <button id="mute-button"
        style="position:absolute;top:12px;right:108px;z-index:9999;width:38px;height:38px;border:none;
               border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
               font:600 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
               line-height:1;display:flex;align-items:center;justify-content:center;
               -webkit-tap-highlight-color:transparent;">&#128266;</button>

      <div id="hud">
        <div id="countdown-overlay" class="hidden">3</div>

        <div id="topLeft">
          <div id="score">SCORE: 0</div>
          <div id="combo" class="hidden">COMBO x1.0</div>
        </div>

        <div id="lives-tray"></div>

        <div id="ooze-indicator" class="hidden">
          <span class="ooze-icon">🧪</span>
          <div class="ooze-bar"><div id="ooze-fill"></div></div>
        </div>

        <div id="stage-banner" class="hidden"></div>

        <div id="paused-badge" class="hidden">PAUSED</div>
      </div>

      <div id="gameover-overlay" class="overlay hidden">
        <div class="title">GAME OVER</div>
        <div id="final-score"></div>
        <div id="final-combo"></div>
        <button id="restart-button">RETRY</button>
      </div>
    </div>

    <script type="module" src="/src/core/main.js"></script>
  </body>
</html>
