<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // GoBalance SDK integration — see ../GOBALANCE_SDK.md for the full contract this depends
      // on. Everything below is a no-op outside the Unity WebView (guarded by
      // `if (window.Unity)` / feature checks), so it's always safe to ship, including when
      // testing in a normal browser.

      // The only channel for JS errors on-device — there's no devtools console inside the
      // WebView, so surface them through the native bridge instead.
      window.addEventListener('error', function (e) {
        if (window.Unity) window.Unity.call('JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (window.Unity) window.Unity.call('JS UNHANDLED REJECTION: ' + e.reason);
      });

      // rAF shim: WKWebView treats the occluded Unity overlay as a background tab and
      // suspends requestAnimationFrame entirely. Queue callbacks instead of scheduling them
      // natively; Unity's WebGameController flushes the queue via window.__pumpFrames() every
      // frame (~60Hz) regardless of tab visibility.
      (function () {
        var nativeRAF = window.requestAnimationFrame.bind(window);
        window.__rafQueue = [];
        window.requestAnimationFrame = function (cb) { window.__rafQueue.push(cb); return window.__rafQueue.length; };
        window.cancelAnimationFrame = function () {};
        window.__pumpFrames = function () {
          var q = window.__rafQueue;
          if (!q.length) return;
          window.__rafQueue = [];
          var t = performance.now();
          for (var i = 0; i < q.length; i++) {
            try { q[i](t); }
            catch (e) { if (window.Unity) window.Unity.call('RAF CB ERROR: ' + e.message); }
          }
        };
        // A real native rAF loop keeps draining the queue too -- ALWAYS,
        // inside Unity or not (reverted 2026-07-30). An earlier change gated
        // this behind `!window.Unity` to avoid a PC/editor frame-pacing
        // jitter from two drivers, but that left the game inside the WebView
        // driven ONLY by Unity's EvaluateJS bridge pump -- which on Android
        // is slow enough to cripple the frame rate ("super slow"). Both
        // drivers draining the same queue is harmless (an empty-queue drain
        // is a no-op), and lets the WebView's own rAF run frames at native
        // speed on platforms where it isn't suspended. The original
        // GOBALANCE_SDK.md boilerplate runs this unconditionally; matching it.
        (function nativeLoop() { nativeRAF(function () { window.__pumpFrames(); nativeLoop(); }); })();
      })();
    </script>
    <!-- The title tag below uses Vite's native index.html env-token
         replacement (see the per-theme .env files in the project root) --
         picks exactly one string at build time, no leftover text from the
         other theme in either build's shipped HTML. NOTE: Vite's token
         replacement is a plain find-replace across the whole file, so
         don't write the literal token text anywhere else in this file
         (including comments) unless you want it substituted there too. -->
    <title>%VITE_APP_TITLE%</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="renderCanvas"></canvas>

      <!-- GoBalance SDK: native-bridge Back button. Returns to the SDK games list.
           Cross-game HUD convention (see BUILD_NOTES.md): back + pause live top-right
           as icon-only buttons, back is a plain X, score/status live top-left.
           absolute (not fixed) -- positioned relative to #stage, the locked-aspect
           box, so it stays anchored to the visible game frame, not the raw viewport. -->
      <button id="gb-back"
        onclick="if(window.Unity)window.Unity.call('nav:back');"
        style="position:absolute;top:12px;right:12px;z-index:9999;width:38px;height:38px;border:none;
               border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
               font:600 20px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
               line-height:1;display:flex;align-items:center;justify-content:center;
               -webkit-tap-highlight-color:transparent;">&times;</button>

      <!-- Pause button -- placeholder glyph icon (real icon art later); sits left of
           Back per the same convention. -->
      <button id="pause-button"
        style="position:absolute;top:12px;right:60px;z-index:9999;width:38px;height:38px;border:none;
               border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
               font:600 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
               line-height:1;display:flex;align-items:center;justify-content:center;
               -webkit-tap-highlight-color:transparent;">&#9208;</button>

      <!-- Settings button -- sits left of Pause, same icon-button convention.
           Gear glyph; opens #settings-panel (src/ui/settingsPanel.js) with
           SENSITIVITY/MUSIC/SFX (2026-08-19, replaces the old single
           mute-button -- see systems/audio.js). -->
      <button id="settings-button" title="Settings"
        style="position:absolute;top:12px;right:108px;z-index:9999;width:38px;height:38px;border:none;
               border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
               font:600 17px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
               line-height:1;display:flex;align-items:center;justify-content:center;
               -webkit-tap-highlight-color:transparent;">&#9881;</button>

      <!-- Settings panel -- rows built in JS (src/ui/settingsPanel.js), same
           touch+two-key (Enter=next row, Space=change) model as
           HalfShellHustle's steering panel, since inside the real Unity
           WebView there is no pointer at all in this game's analog
           steering mode -- see that file's header for the full contract. -->
      <div id="settings-panel" class="hidden"></div>

      <div id="hud">
        <div id="countdown-overlay" class="hidden">3</div>

        <div id="topLeft">
          <div id="score">0</div>
          <!-- Progression fill bar toward the next level's score threshold
               (2026-08-03) -- hidden on the final stage (no next threshold). -->
          <div id="score-bar"><div id="score-bar-fill"></div></div>
          <div id="combo" class="hidden">COMBO x1.0</div>
        </div>

        <div id="lives-tray"></div>

        <!-- Active-buff chips (ooze/shield/magnet) -- built dynamically in
             ui.js, hidden until each buff is active. -->
        <div id="buff-tray"></div>

        <!-- Pizza-box collection chips (progression update) -- built
             dynamically per color in ui.js, hidden until each box is active. -->
        <div id="box-tray"></div>

        <div id="paused-badge" class="hidden">PAUSED</div>

        <!-- Box-completion celebrations. Each: box icon + "<COLOR> BOX!" + the
             bonus, then a BIG reveal of the booster you earned (+ "+1 LIFE" for
             the red box). Up to 3 can show AT ONCE, side by side and centered as
             a group, so two boxes finishing close together don't cut each other
             off. The popup instances + layout are built/managed in ui.js. -->
        <div id="box-complete-tray"></div>
      </div>

      <div id="gameover-overlay" class="overlay hidden">
        <div class="title">GAME OVER</div>
        <div id="final-score"></div>
        <div id="final-combo"></div>
        <button id="restart-button">RETRY</button>
      </div>

      <!-- First-run onboarding tutorial (shown every run: boot() and the
           restart button both call beginIntro() -- see core/main.js). Own
           ids throughout (intro-next-button/intro-start-button), distinct
           from #restart-button, so the SDK's gameover-only synthetic click
           can never target these. Step 1: what to catch/avoid (no board, no
           character -- pure item recognition). Step 2: how to move (a
           CONTINUOUS board+character sweep, not a lane-snap cycle -- this
           game's input is analog/continuous lean, not an absolute lane
           target; see data/introTutorial.js). -->
      <div id="intro-tutorial-overlay" class="overlay hidden">
        <div id="intro-step-items" class="intro-step">
          <div class="intro-step-title">KNOW YOUR ITEMS</div>
          <div class="intro-items-row">
            <div class="intro-item-panel intro-item-good">
              <div class="intro-item-badge intro-badge-good">&#10003;</div>
              <div class="intro-item-icons">
                <img id="intro-icon-pizza" class="intro-item-icon" alt="" />
                <img id="intro-icon-shield" class="intro-item-icon" alt="" />
                <img id="intro-icon-magnet" class="intro-item-icon" alt="" />
                <img id="intro-icon-wave" class="intro-item-icon" alt="" />
              </div>
              <div class="intro-item-label">CATCH</div>
            </div>
            <div class="intro-item-panel intro-item-bad">
              <div class="intro-item-badge intro-badge-bad">&#10007;</div>
              <div class="intro-item-icons">
                <img id="intro-icon-bomb" class="intro-item-icon" alt="" />
              </div>
              <div class="intro-item-label">AVOID</div>
            </div>
          </div>
          <button id="intro-next-button">NEXT</button>
        </div>
        <div id="intro-step-steer" class="intro-step hidden">
          <div class="intro-step-title">TILT LEFT &amp; RIGHT TO MOVE</div>
          <!-- Fixed width+height box (not sized off either source frame) --
               the two run-cycle frames (see core/heroAssets.*.js) are
               genuinely different poses (arms/legs spread differently
               mid-stride, verified via each PNG's own alpha content bbox --
               not asset padding), so no single non-distorting size is
               IDENTICAL for both. object-fit: contain letterboxes each
               frame inside this one unchanging box (invisible, since the
               PNGs are transparent) instead of the box itself changing
               size -- locks HEIGHT (the axis that read as "small big small
               big") to zero variance between frames; only a small
               transparent-letterboxed width gap differs. -->
          <img id="intro-steer-player" class="intro-sprite" alt="" />
          <div id="intro-steer-board" class="intro-board"></div>
          <button id="intro-start-button">START</button>
        </div>
      </div>

      <!-- Stage-complete transition (freeze + curtain, ported from
           HalfShellHustle's level-complete pattern -- see
           WEB_MINIGAME_TECH_RETROSPECTIVE.md and data/stageTransition.js).
           Curtain panels are SIBLINGS of #stage-complete-overlay, deliberately
           NOT children of it: the overlay goes display:none the instant
           hideStageComplete runs, and a CSS transition cannot play on an
           element whose ancestor just went display:none -- nested, the
           opening slide would silently never animate. Own explicit z-index
           for the same reason (no longer inheriting .overlay's). -->
      <div id="stage-curtain-left" class="stage-curtain"></div>
      <div id="stage-curtain-right" class="stage-curtain"></div>

      <div id="stage-complete-overlay" class="overlay hidden">
        <div id="sc-headline">STAGE CLEAR!</div>
        <div id="sc-next">NEXT: FIRE ESCAPE</div>
        <div id="sc-countdown">4</div>
      </div>
    </div>

    <script type="module" src="/src/core/main.js"></script>
  </body>
</html>
