<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Wagon Rampage</title>
  <link rel="icon" href="data:," />
  <script>
    // GoBalance SDK integration — see GOBALANCE_SDK.md for the full contract this depends
    // on. Everything below is a no-op outside the Unity WebView (guarded by
    // `if (window.Unity)` / feature checks), so it's always safe to ship, including when
    // testing in a normal browser.

    // The only channel for JS errors on-device — there's no devtools console inside the
    // WebView, so surface them through the native bridge instead.
    window.addEventListener('error', function (e) {
      if (window.Unity) window.Unity.call('JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (window.Unity) window.Unity.call('JS UNHANDLED REJECTION: ' + e.reason);
    });

    // rAF shim: WKWebView treats the occluded Unity overlay as a background tab and
    // suspends requestAnimationFrame entirely. Queue callbacks instead of scheduling them
    // natively; Unity's WebGameController flushes the queue via window.__pumpFrames() every
    // frame (~60Hz) regardless of tab visibility. A real native rAF loop keeps running
    // underneath too, so a normal browser (testing outside Unity) behaves exactly as before.
    (function () {
      var nativeRAF = window.requestAnimationFrame.bind(window);
      window.__rafQueue = [];
      window.requestAnimationFrame = function (cb) { window.__rafQueue.push(cb); return window.__rafQueue.length; };
      window.cancelAnimationFrame = function () {};
      window.__pumpFrames = function () {
        var q = window.__rafQueue;
        if (!q.length) return;
        window.__rafQueue = [];
        var t = performance.now();
        for (var i = 0; i < q.length; i++) {
          try { q[i](t); }
          catch (e) { if (window.Unity) window.Unity.call('RAF CB ERROR: ' + e.message); }
        }
      };
      (function nativeLoop() { nativeRAF(function () { window.__pumpFrames(); nativeLoop(); }); })();
    })();
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- GoBalance SDK: native-bridge Back button. Returns to the SDK games list. -->
  <button id="gb-back"
    onclick="if(window.Unity)window.Unity.call('nav:back');"
    style="position:fixed;top:12px;left:12px;z-index:9999;padding:8px 16px;border:none;
           border-radius:999px;background:rgba(20,20,40,0.72);color:#eafcff;
           font:600 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;
           -webkit-tap-highlight-color:transparent;">&#8249; Back</button>

  <canvas id="game"></canvas>
  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="speedlines"></div>

  <div id="corner-btns">
    <button id="pause-btn" class="round-btn" aria-label="Pause">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button id="mute-btn" class="round-btn" aria-label="Mute">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke-width="2"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="2"/></svg>
    </button>
  </div>

  <div id="hud">
    <div id="hud-top">
      <div id="timer">90</div>
      <div id="goal"><span id="wrecks">0</span><span class="of">/<span id="target">12</span></span><small>WRECKED</small></div>
      <div id="score">0</div>
    </div>
    <div id="combo-wrap"><div id="combo">x1</div><div id="combo-bar"><i></i></div></div>
    <div id="shell"><i></i><span>SHELL</span></div>
    <div id="raph-slot"><div id="raph-ring"></div><span>POWER</span></div>
    <div id="buff"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="46"/><circle class="fg" cx="50" cy="50" r="46"/></svg><img alt=""><b></b><i></i></div>
    <div id="gadget" class="buffring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="46"/><circle class="fg" cx="50" cy="50" r="46"/></svg><img alt=""><b></b><i></i></div>
  </div>
  <div id="popups"></div>
  <div id="april-tag" class="hidden"><b>APRIL</b><i><u></u></i></div>
  <div id="say" class="hidden"></div>
  <div id="hint" class="hidden"></div>
  <div id="banner"></div>
  <div id="turn"><span class="l">&#9664; LEFT<small>APRIL WENT LEFT</small></span><span class="r">RIGHT &#9654;<small>APRIL WENT RIGHT</small></span></div>
  <div id="countdown"></div>
  <div id="loading">LOADING…</div>

  <div id="pause-overlay" class="overlay hidden">
    <div class="panel"><h2>PAUSED</h2><button id="resume-button" class="big-btn">RESUME</button></div>
  </div>

  <!-- talking scenes before / after each level (src/story.js) -->
  <div id="story" class="hidden">
    <div id="story-cast"></div>
    <div id="story-bubble" class="bubble hidden"></div>
    <div id="story-card" class="hidden">
      <small id="story-level"></small>
      <h1 id="story-title"></h1>
      <p id="story-goal"></p>
      <div id="story-go"></div>
    </div>
    <button id="story-skip">SKIP &#9656;&#9656;</button>
    <div id="story-tap">TAP TO CONTINUE</div>
  </div>

  <div id="gameover-overlay" class="overlay hidden">
    <div class="panel">
      <small id="over-level"></small>
      <h2 id="over-title">STREET CLEARED!</h2>
      <p id="over-why"></p>
      <div id="over-stars"></div>
      <div class="stats">
        <div><b id="over-wrecks">0</b><span>FOOT CARS WRECKED</span></div>
        <div><b id="over-score">0</b><span>SCORE</span></div>
        <div><b id="over-combo">x1</b><span>BEST COMBO</span></div>
      </div>
      <button id="restart-button" class="big-btn">TRY AGAIN</button>
      <button id="next-button" class="big-btn hidden">NEXT LEVEL</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
