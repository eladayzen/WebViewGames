<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<script>
      // GoBalance SDK integration — see ../GOBALANCE_SDK.md for the full contract this depends
      // on. Everything below is a no-op outside the Unity WebView (guarded by
      // `if (window.Unity)` / feature checks), so it's always safe to ship, including when
      // testing in a normal browser.

      // The only channel for JS errors on-device — there's no devtools console inside the
      // WebView, so surface them through the native bridge instead.
      window.addEventListener('error', function (e) {
        if (window.Unity) window.Unity.call('JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (window.Unity) window.Unity.call('JS UNHANDLED REJECTION: ' + e.reason);
      });

      // rAF shim: WKWebView treats the occluded Unity overlay as a background tab and
      // suspends requestAnimationFrame entirely. Queue callbacks instead of scheduling them
      // natively; Unity's WebGameController flushes the queue via window.__pumpFrames() every
      // frame (~60Hz) regardless of tab visibility. A real native rAF loop keeps running
      // underneath too, so a normal browser (testing outside Unity) behaves exactly as before.
      (function () {
        var nativeRAF = window.requestAnimationFrame.bind(window);
        window.__rafQueue = [];
        window.requestAnimationFrame = function (cb) { window.__rafQueue.push(cb); return window.__rafQueue.length; };
        window.cancelAnimationFrame = function () {};
        window.__pumpFrames = function () {
          var q = window.__rafQueue;
          if (!q.length) return;
          window.__rafQueue = [];
          var t = performance.now();
          for (var i = 0; i < q.length; i++) {
            try { q[i](t); }
            catch (e) {
              // ON-DEVICE this is the only channel there is: no console exists
              // inside the WebView, so the native bridge is it.
              if (window.Unity) window.Unity.call('RAF CB ERROR: ' + e.message);
              // IN A BROWSER, `window.Unity` is undefined, so this catch used to
              // discard the exception entirely -- every frame, forever. A typo in
              // the frame callback then presented as a game that simply stopped
              // advancing with a clean console, which is indistinguishable from a
              // design problem and is exactly how a broken build gets waved
              // through on a dev server. Re-raising is not an option (it would
              // break the pump), so it is logged instead.
              else if (typeof console !== 'undefined' && console.error) {
                console.error('RAF CB ERROR:', e);
              }
            }
          }
        };
        (function nativeLoop() { nativeRAF(function () { window.__pumpFrames(); nativeLoop(); }); })();
      })();
    </script>
    <title>TMNT Survivor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The X is the only way out of a game on the board, and it carries
         #gb-back because every game in this repo does -- the id travels even
         though each game styles the button into its own chrome. The inline
         handler is the fallback for a build whose module failed to load: a
         game that cannot boot must still be escapable. -->
    <div id="chrome">
      <button id="gb-back" type="button" aria-label="Quit"
              onclick="(window.__gbBack ? window.__gbBack() : (window.Unity &amp;&amp; window.Unity.call('nav:back')))">&#10005;</button>
      <!-- QUIT THEN PAUSE, the same order in every game in this repo, so a
           child who learns one knows them all. The X keeps the inline
           fallback above; pause is wired in main.js because it has to stop
           the ticker, and a game that failed to boot has nothing to pause. -->
      <button id="pause-button" type="button" aria-label="Pause">&#10074;&#10074;</button>
    </div>

    <div id="stage"><canvas id="game"></canvas></div>

    <!-- THE RUN, READ AT A GLANCE. See src/ui/hud.js for what each piece is
         for; the short version is that the player is standing back from the
         phone on a balance board and cannot read a sentence, so everything
         here is a bar, a pip or one large number. The xp bar spans the top
         because it is the thing they should never have to look for. -->
    <div id="hud">
      <div id="hud-bar">
        <div id="level-badge">LV<span id="level-num">1</span></div>
        <div id="xp-track"><div id="xp-fill"></div></div>
        <div id="run-time">0:00</div>
      </div>
      <!-- NO HEALTH HERE. The pool is drawn over the character's own head,
           in world space -- see HP_BAR in src/main.js for why it moved. -->
      <div id="hud-row">
        <div id="kills"><span id="kill-num">0</span><small>KO</small></div>
      </div>
      <!-- What is already stacked, so a level-up choice can be made against
           it rather than from memory. -->
      <div id="build-chips"></div>
    </div>

    <!-- THE LEVEL-UP CHOICE. Three cards, picked by leaning and committed by
         holding -- see src/core/levelup.js for why holding, and why there is
         a grace period before the hold counts. -->
    <div id="levelup" class="hidden"></div>

    <!-- THE REQUIRED DOM CONTRACT. #gameover-overlay and #restart-button are
         named by GOBALANCE_SDK.md; the app looks for this shape, so the ids
         are not ours to rename however the game styles them. -->
    <div id="gameover-overlay" class="hidden">
      <div id="gameover-card">
        <div id="gameover-title">OVERRUN</div>
        <div id="gameover-stats"></div>
        <button id="restart-button" type="button">GO AGAIN</button>
      </div>
    </div>

    <!-- PAUSED. Shown over the frozen field rather than painted across it:
         a survivor run is a position you are holding, and hiding the horde
         you are standing in loses the only thing worth looking at while you
         decide. -->
    <div id="paused-overlay" class="hidden">
      <div class="pause-card">
        <div class="pause-title">PAUSED</div>
        <button id="resume-button" type="button">KEEP GOING</button>
      </div>
    </div>

    <!-- QUIT CONFIRM, over the PAUSED field for the same reason -- the player
         has to see the run they are being asked to give up. Only ever shown
         mid-run: asking "are you sure?" over a screen they already chose is
         noise. -->
    <div id="confirm-overlay" class="hidden">
      <div class="pause-card">
        <div class="pause-title">QUIT?</div>
        <div class="pause-sub">This run ends here.</div>
        <div class="pause-buttons">
          <button id="confirm-stay" type="button">KEEP PLAYING</button>
          <button id="confirm-quit" type="button">QUIT</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
